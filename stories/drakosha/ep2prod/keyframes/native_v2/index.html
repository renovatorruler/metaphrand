<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frosya and Vasya — Episode 2 Illustration Review</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #17120d;
      color: #fff7e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
    }
    header {
      max-width: 1800px;
      margin: 0 auto 26px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 4vw, 44px);
    }
    .instruction {
      margin: 0;
      color: #d5c7b2;
      font-size: clamp(16px, 2vw, 20px);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr));
      gap: 28px;
      max-width: 1800px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border: 2px solid #6f5a3e;
      border-radius: 14px;
      background: #241b13;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .35);
    }
    figure a {
      position: relative;
      display: block;
      background: #000;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }
    .number {
      position: absolute;
      top: 14px;
      left: 14px;
      display: grid;
      place-items: center;
      min-width: 72px;
      height: 54px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(20, 13, 8, .92);
      border: 3px solid #fff7e8;
      color: #fff7e8;
      font-size: 25px;
      font-weight: 800;
      line-height: 1;
    }
    figcaption {
      padding: 14px 18px 17px;
      font-size: 21px;
      font-weight: 700;
    }
    figcaption small {
      display: block;
      margin-top: 4px;
      color: #cbbca7;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <header>
    <h1>Frosya and Vasya — Episode 2 Illustrations</h1>
    <p class="instruction">Tap any image to open its original full-resolution PNG. Use the K-number when leaving feedback.</p>
  </header>
  <main class="gallery">
    <figure>
      <a href="K00_letter_V_reveal_candidate.png"><img src="K00_letter_V_reveal_candidate.png" alt="K00: Mama reveals the new letter" fetchpriority="high"><span class="number">K00</span></a>
      <figcaption>Letter reveal<small>Vasya is thrilled; Frosya sees that the new letter does not help her spell the car she wants.</small></figcaption>
    </figure>
    <figure>
      <a href="K01_under_porch_family_setup_candidate.png"><img src="K01_under_porch_family_setup_candidate.png" alt="K01: Family arrives at the under-porch practice area" loading="lazy"><span class="number">K01</span></a>
      <figcaption>Practice-area arrival<small>The family prepares the improvised under-porch training space.</small></figcaption>
    </figure>
    <figure>
      <a href="K02_frosya_scooter_stunt_candidate.png"><img src="K02_frosya_scooter_stunt_candidate.png" alt="K02: Frosya performs a scooter stunt" loading="lazy"><span class="number">K02</span></a>
      <figcaption>Frosya's scooter stunt<small>Helmet, bell, ramp, and cotton landing establish her version of magic practice.</small></figcaption>
    </figure>
    <figure>
      <a href="K03_ox_tug_of_war_candidate.png"><img src="K03_ox_tug_of_war_candidate.png" alt="K03: Ox Vasya pulls Papa into cotton" loading="lazy"><span class="number">K03</span></a>
      <figcaption>Ox tug-of-war<small>Vasya discovers how powerful and funny his new ox form can be.</small></figcaption>
    </figure>
    <figure>
      <a href="K04_owl_precision_candidate.png"><img src="K04_owl_precision_candidate.png" alt="K04: Owl Vasya catches a berry" loading="lazy"><span class="number">K04</span></a>
      <figcaption>Owl precision test<small>The corrected frame contains one berry: in the owl's claw, with Papa's hand empty.</small></figcaption>
    </figure>
    <figure>
      <a href="K05_platform_failure_candidate.png"><img src="K05_platform_failure_candidate.png" alt="K05: Platform support fails after the collision" loading="lazy"><span class="number">K05</span></a>
      <figcaption>Platform failure<small>The fallen scooter, skidding wolf, displaced support, and sagging platform show the accident in one beat.</small></figcaption>
    </figure>
    <figure>
      <a href="K06_papa_pinned_runoff_begins_candidate.png"><img src="K06_papa_pinned_runoff_begins_candidate.png" alt="K06: Papa is pinned while runoff begins" loading="lazy"><span class="number">K06</span></a>
      <figcaption>Papa pinned; runoff begins<small>Mama evacuates the babies while the giant boy unknowingly sends water toward Papa.</small></figcaption>
    </figure>
    <figure>
      <a href="K07_wolf_rescue_fails_candidate.png"><img src="K07_wolf_rescue_fails_candidate.png" alt="K07: Wolf rescue fails and the pencil is stranded" loading="lazy"><span class="number">K07</span></a>
      <figcaption>Wolf rescue fails<small>Strength alone cannot move the beam, and Frosya cannot reach her pencil.</small></figcaption>
    </figure>
    <figure>
      <a href="K08_owl_retrieves_pencil_candidate.png"><img src="K08_owl_retrieves_pencil_candidate.png" alt="K08: Owl Vasya retrieves the pencil" loading="lazy"><span class="number">K08</span></a>
      <figcaption>Owl retrieves the pencil<small>Vasya crosses the water and returns the one tool Frosya needs.</small></figcaption>
    </figure>
    <figure>
      <a href="K09_frosya_crowbar_alone_candidate.png"><img src="K09_frosya_crowbar_alone_candidate.png" alt="K09: Frosya tries the crowbar alone" loading="lazy"><span class="number">K09</span></a>
      <figcaption>Frosya tries the crowbar alone<small>Her idea is correct, but she does not have enough strength by herself.</small></figcaption>
    </figure>
    <figure>
      <a href="K10_combined_rescue_candidate.png"><img src="K10_combined_rescue_candidate.png" alt="K10: Combined rescue with Frosya, ox Vasya, and Mama" loading="lazy"><span class="number">K10</span></a>
      <figcaption>Combined rescue<small>Frosya controls the lever, ox-Vasya supplies force, and Mama pulls Papa free.</small></figcaption>
    </figure>
    <figure>
      <a href="K11_human_boy_finds_bell_candidate.png"><img src="K11_human_boy_finds_bell_candidate.png" alt="K11: The human boy finds the miniature brass bell" loading="lazy"><span class="number">K11</span></a>
      <figcaption>The boy finds the bell<small>A normal-sized human discovers an impossible miniature object after the runoff.</small></figcaption>
    </figure>
    <figure>
      <a href="K12_hidden_door_feather_candidate.png"><img src="K12_hidden_door_feather_candidate.png" alt="K12: Frosya and Vasya discover a feather at the hidden door" loading="lazy"><span class="number">K12</span></a>
      <figcaption>Hidden-door mystery<small>A damp owl feather and faint forest-colored light deepen the season mystery without explaining it.</small></figcaption>
    </figure>
  </main>
</body>
</html>
