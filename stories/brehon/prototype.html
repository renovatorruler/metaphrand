/* ============ SVG HELPERS ============ */
function polar(cx,cy,r,deg){ const a=deg*Math.PI/180; return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; }
function dotRing(cx,cy,r,dot,n){ let s=""; for(let i=0;i<n;i++){ const[dx,dy]=polar(cx,cy,r,i*(360/n)); s+=`<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${r>30?1.6:1.2}" fill="${dot}"/>`; } return s; }
function cathachC(size, ink, dot) {
	const cx=36, cy=36, midR=21, sw=10.5, a1=44, a2=316;
	const [sx,sy]=polar(cx,cy,midR,a1), [ex,ey]=polar(cx,cy,midR,a2);
	const arc=`M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${midR} ${midR} 0 1 0 ${ex.toFixed(1)} ${ey.toFixed(1)}`;
	function wedge(ang,dir){ const[bx,by]=polar(cx,cy,midR+sw/2,ang),[ix,iy]=polar(cx,cy,midR-sw/2,ang),[tx,ty]=polar(cx,cy,midR+sw/2+4.5,ang+8*dir); return `M ${ix.toFixed(1)} ${iy.toFixed(1)} L ${bx.toFixed(1)} ${by.toFixed(1)} L ${tx.toFixed(1)} ${ty.toFixed(1)} Z`; }
	let dots=""; const dotR=midR+sw/2+4.2;
	for(let a=a1+4;a<=a2-4;a+=10){ const[dx,dy]=polar(cx,cy,dotR,a); dots+=`<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="1.5" fill="${dot}"/>`; }
	return `<svg class="dropcap-svg" width="${size}" height="${size}" viewBox="0 0 72 72" fill="none">${dots}<path d="${arc}" stroke="${ink}" stroke-width="${sw}"/><path d="${wedge(a1,1)}" fill="${ink}"/><path d="${wedge(a2,-1)}" fill="${ink}"/></svg>`;
}
function dropCap(size, letter, ink, dot) {
	const vbW = 55, vbH = 72, cx = 33;
	let dots="";
	for (let a=52; a<=308; a+=8) { const [dx,dy]=polar(cx,36,31,a); dots += `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="1.5" fill="${dot}"/>`; }
	const w = (size * vbW / vbH).toFixed(1);
	return `<svg class="dropcap-svg" width="${w}" height="${size}" viewBox="0 0 ${vbW} ${vbH}" fill="none">${dots}<text x="${cx}" y="55" text-anchor="middle" font-family="Palatino,Georgia,serif" font-size="62" font-weight="700" fill="${ink}">${letter}</text></svg>`;
}
function dropCapTitle(t, title) {
	if (title.length < 40) return title;
	return `${dropCap(58, title[0], t.ink, t.accent)}<span class="dim1">${title[1]}</span><span class="dim2">${title[2]}</span><span class="dim3">${title[3]}</span>${title.slice(4)}`;
}
function ringedSiglum(t, initials, size, ring) {
	const c = size/2;
	/* the identity chevron is drawn, not typed — a font caret is too light to carry the brand */
	const mark = initials === "^"
		? `<path d="M ${(c-size*0.17).toFixed(1)} ${(c+size*0.115).toFixed(1)} L ${c} ${(c-size*0.115).toFixed(1)} L ${(c+size*0.17).toFixed(1)} ${(c+size*0.115).toFixed(1)}" fill="none" stroke="${t.ink}" stroke-width="${Math.max(1.8,size*0.055).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>`
		: `<text x="${c}" y="${c+size*0.09}" text-anchor="middle" font-family="Palatino,Georgia,serif" font-size="${size*0.3}" font-weight="700" fill="${t.ink}">${initials}</text>`;
	return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
		${ring ? dotRing(c,c,c-3,t.accent,Math.round(size/4)) : ""}
		<circle cx="${c}" cy="${c}" r="${c-(ring?11:6)}" fill="none" stroke="${t.ink}" stroke-width="${size>60?2.5:1.6}"/>
		${mark}
	</svg>`;
}
function brehonMark(t, ini) {
	return `<svg width="26" height="26" viewBox="0 0 26 26">${dotRing(13,13,11.5,t.accent,16)}<circle cx="13" cy="13" r="8.5" fill="none" stroke="${t.ink}" stroke-width="1.6"/><text x="13" y="16.5" text-anchor="middle" font-family="Helvetica" font-size="7.5" font-weight="800" fill="${t.ink}">${ini}</text></svg>`;
}
function sealSvg(t, size) {
	const c=size/2, arm=size*0.22;

}

/* icon vocabulary — the snapwand's two poses, shrunk: a rod bent (survived) or snapped (broke) */
/* bent = a rod arched under load, still whole; broken = two planks fallen apart, a cross at the fracture. */
function icoBent(col) { return `<svg width="14" height="12" viewBox="0 0 14 12" style="flex-shrink:0">
	<path d="M1.4 9.8 Q7 3.2 12.6 9.8" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>
</svg>`; }
function icoBroken(col) { return `<svg width="14" height="12" viewBox="0 0 14 12" style="flex-shrink:0">
	<path d="M0.9 8.4 L5.3 10.2 M8.7 10.2 L13.1 8.4" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/>
	<path d="M5.4 1.6 L8.6 4.8 M8.6 1.6 L5.4 4.8" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>
</svg>`; }
function icoComment(col) { return `<svg width="11" height="10" viewBox="0 0 12 11" style="flex-shrink:0"><path d="M1.5 1.3 h9 v5.8 h-4.8 l-2.4 2.4 v-2.4 h-1.8 z" fill="none" stroke="${col}" stroke-width="1.4" stroke-linejoin="round"/></svg>`; }
/* one chip carries case + fate: color is the verdict, icon is the fate, code is the address */
function caseChip(c, code, cs) {
	const wrap = (col, inner) => `<span class="case-chip" style="display:inline-flex;align-items:center;gap:5px;color:${col}" data-action="go" data-screen="casedetail" data-case="${code}">${inner}</span>`;
	if (cs && cs.status === "resolved") {
		const vc = verdictColor(c, cs.verdict);
		const ico = cs.verdict === "BENT" ? icoBent(vc) : cs.verdict === "BROKEN" ? icoBroken(vc) : `<span style="font-size:11px;line-height:1">&#9998;</span>`;
		return wrap(vc, `${ico}^${code}`);
	}
	if (cs && (cs.status === "cured" || cs.status === "conceded")) return wrap(c.bent, `&#10003;&hairsp;$0 ^${code}`);
	return wrap(c.amber, `&#9878;&#xFE0E;&hairsp;^${code}`);
}

screens.thread = function(params) {

		if (!a.case || !CASES[a.case]) return null;

	let list = th.attempts.slice();
	if (filter === "ruled") list = list.filter(a => { const cs = ruledStatus(a); return cs && cs.status === "resolved"; });
	if (filter === "open") list = list.filter(a => { const cs = ruledStatus(a); return !cs || cs.status !== "resolved"; });
	if (filter === "hot") list = list.sort((x, y) => Math.min(y.votes[0], y.votes[1]) - Math.min(x.votes[0], x.votes[1]));
	const FILTERS = [["all","ALL"],["hot","CONTROVERSIAL"],["ruled","RULED"],["open","OPEN"]];

		? `<div style="position:absolute;top:24px;left:0;z-index:40;background:${c.box};border:1px solid ${c.hair};min-width:148px;box-shadow:0 8px 22px rgba(0,0,0,.18)">${FILTERS.map(([id,label]) =>

		const cs = ruledStatus(a);

			? `<span class="case-chip" style="display:inline-flex;align-items:center;gap:5px;color:${c.accent}" data-action="startChallenge" data-thread="${params.thread||"pizza"}" data-attemptidx="${th.attempts.indexOf(a)}">&#9878;&#xFE0E;&hairsp;$0 &rsaquo;</span>`
			: caseChip(c, a.case, cs);
		const nComments = (a.g?a.g.length:0) + (extraComments[(params.thread||"pizza")+"|"+th.attempts.indexOf(a)]||[]).length;
		return `
		<div class="gloss-item" style="border-color:${c.dotted}" data-action="go" data-screen="attempt" data-thread="${params.thread||"pizza"}" data-attemptidx="${th.attempts.indexOf(a)}">

				<span style="font-size:8.5px;font-weight:800;letter-spacing:.14em;color:${c.muted}">VOTES</span>

			</div>
		</div>`;
	}).join("");
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead("THREAD")}

			<div class="title-line">${dropCapTitle(c, th.title)}</div>

			</div>

			${th.owner?`<div style="margin-top:11px;padding:9px 12px;border:1px solid ${c.hair};display:flex;justify-content:space-between;align-items:baseline;gap:10px">
				<span style="font-family:Helvetica,sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:${c.bent}">OWNER-FUNDED COURT &middot; WAGES PAID BY ${th.owner.toUpperCase()}</span>
				<span style="font-family:'SF Mono',Menlo,monospace;font-size:10px;color:${c.muted};flex-shrink:0">${th.ownerBudget} left this month</span>
			</div>`:""}
			${(() => {
				const rvCase = Object.entries(CASES).find(([,x]) => x.ruleReview && x.thread === (params.thread||"pizza"));
				return rvCase
					? `<div style="margin-top:9px;font-family:Helvetica,sans-serif;font-size:10.5px;font-weight:700;color:${c.amber};cursor:pointer" data-action="go" data-screen="casedetail" data-case="${rvCase[0]}">&#9888; Rule ${rvCase[1].ruleNum} under validity review &middot; ^${rvCase[0]} &rsaquo;</div>`
					: `<div style="margin-top:9px;font-family:Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;color:${c.muted};cursor:pointer" data-action="startRuleReview" data-thread="${params.thread||"pizza"}">^ CHALLENGE A RULE'S VALIDITY</div>`;
			})()}
			<div class="attempts-row" style="border-color:${c.hair}">
				<span class="sec-label" style="color:${c.muted}">ATTEMPTS TO BEND IT</span>
				<span class="newattempt" style="color:${c.accent}" data-action="go" data-screen="create" data-thread="${params.thread||"pizza"}">+ ATTEMPT</span>
			</div>
			<div style="position:relative;margin-top:11px">
				<span data-action="toggleFilterMenu" style="display:inline-flex;align-items:center;gap:6px;font-family:Helvetica,sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.1em;cursor:pointer;color:${c.muted};padding:4px 0">${fLabel} <span style="font-size:7.5px;transform:translateY(-.5px)">&#9660;</span></span>
				${fmenu}
			</div>
			<div class="gloss-block" style="border-color:${c.dotted};margin-top:10px">${attempts || `<div class="helper" style="color:${c.muted};padding:14px 0">Nothing here under this filter.</div>`}</div>
		</div>
		${capsuleNav("explore")}
	</div>`;
};

/* ============ ATTEMPT DETAIL ============ */
screens.attempt = function(params) {
	const c = t();
	const th = THREADS[params.thread || "pizza"];
	const a = th.attempts[params.attemptidx || 0];
	const cs = CASES[a.case];
	const vc = verdictColor(c, a.verdict);
	const commentKey = (params.thread||"pizza") + "|" + (params.attemptidx||0);
	const commentList = [
		...(a.g || []),
		...(extraComments[commentKey] || [])
	];
	const commentCount = commentList.length;
	const comments = commentList.map(cm => `<div class="comment-item" style="border-color:${c.dotted}">
			<div class="chead" style="color:${c.muted}"><b style="color:${c.ink}">${cm.who}</b><span>${cm.when}</span></div>
			<div class="comment-body" style="color:${c.ink}">${cm.body}</div>
		</div>`).join("");
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead("ATTEMPT")}
		<div class="folio">
			<div class="context" style="color:${c.muted}">In <span class="ttitle-inline" style="color:${c.ink}">&ldquo;${th.title}&rdquo;</span></div>
			<div class="attempt-full-head" style="color:${c.muted}">
				<span class="mini-av" style="background:${c.avBg};color:${c.ink}">${a.ini}</span>
				<span style="color:${c.ink}">${a.author}</span><span>&middot; ${a.when}</span>
			</div>
			<div class="attempt-full-body" style="color:${c.ink}">${a.body}</div>
			${!a.case ? `
				<div class="band" style="border-color:${c.accent};background:${c.box};margin-top:16px">
					<div class="band-row1"><span class="band-word" style="color:${c.accent}">UNCHALLENGED</span></div>
					<div class="band-sub" style="color:${c.muted}">No one has disputed this bend. A challenge starts as a $0 demand &mdash; money enters only if it escalates.</div>
					<div class="band-cta" style="background:${c.accent};color:${c.accentInk};margin-top:11px" data-action="startChallenge" data-thread="${params.thread||"pizza"}" data-attemptidx="${params.attemptidx||0}">CHALLENGE &middot; SEND A DEMAND &middot; $0</div>
				</div>`
			: cs && cs.status === "resolved" ? `
				<div class="verdict-strip" style="border-color:${c.hair}">
					<span class="v-word" style="color:${vc}">${cs.verdict}</span>
					<span class="v-meta" style="color:${c.muted}">${cs.adj?"ruled by "+cs.adj:"advocates settled"}</span>
					<span class="v-action" style="color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${a.case}">^${a.case} &rsaquo;</span>
				</div>
				<div class="holding" style="margin-top:11px;font-size:15.5px;color:${c.ink}">${rubric(c, cs.holding)}</div>`
			: cs && (cs.status === "demand" || cs.status === "refused") ? `
				<div class="verdict-strip" style="border-color:${c.hair}">
					<span class="v-word" style="color:${cs.status==="demand"?c.amber:c.red}">${cs.status==="demand"?"DEMAND OPEN":"DEMAND REFUSED"}</span>
					<span class="v-meta" style="color:${c.muted}">${cs.status==="demand"?"$0 &middot; "+(cs.demandClock||"48h")+" to reply":"escalation unlocked"}</span>
					<span class="v-action" style="color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${a.case}">^${a.case} &rsaquo;</span>
				</div>`
			: cs && (cs.status === "cured" || cs.status === "conceded") ? `
				<div class="verdict-strip" style="border-color:${c.hair}">
					<span class="v-word" style="color:${cs.status==="cured"?c.bent:c.muted}">${cs.status==="cured"?"CURED":"CONCEDED"}</span>
					<span class="v-meta" style="color:${c.muted}">resolved at $0, before any bond</span>
					<span class="v-action" style="color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${a.case}">^${a.case} &rsaquo;</span>
				</div>`
			: cs && cs.status === "pending" ? `
				<div class="verdict-strip" style="border-color:${c.hair}">
					<span class="v-word" style="color:${c.amber}">CHALLENGE ISSUED</span>
					<span class="v-meta" style="color:${c.muted}">awaiting a defender to contest</span>
					<span class="v-action" style="color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${a.case}">^${a.case} &rsaquo;</span>
				</div>`
			: `
				<div class="verdict-strip" style="border-color:${c.hair}">
					<span class="v-word" style="color:${c.amber}">IN DELIBERATION</span>
					<span class="v-meta" style="color:${c.muted}">${cs && cs.chal ? cs.chal + " v. " + cs.def : "advocates deliberating"}</span>
					<span class="v-action" style="color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${a.case}">^${a.case} &rsaquo;</span>
				</div>`}
			${(() => {
				const v = voteState[commentKey];
				const barColor = v === "bent" ? c.bent : v === "broken" ? c.red : c.muted;
				return `<div class="votebar" style="color:${c.muted}">
					<span style="font-size:8.5px;font-weight:800;letter-spacing:.14em;color:${c.muted}">VOTES</span>
					<span class="snapwand ${v?"v-"+v:""}" data-votekey="${commentKey}"><span class="wl" style="background:${barColor}"></span><span class="wr" style="background:${barColor}"></span></span>
					<span style="color:${c.bent};font-weight:700">${a.votes[0]+(v==="bent"?1:0)} bent</span><span style="color:${c.red};font-weight:700">${a.votes[1]+(v==="broken"?1:0)} broken</span>
					<span style="font-size:10px">${v?(v==="bent"?"your call: bent — clever, still legal":"your call: broken — it crossed the line"):"tap the rod to bend it &middot; hold to break it"}</span>
				</div>`;
			})()}
			<div style="margin-top:16px">
				${a.case ? disclose("at-rule-"+commentKey, "THE RULE IN QUESTION", "Rule " + (cs?cs.ruleNum:a.ruleNum), `<div class="rule-cited" style="border-color:${c.accent};color:${c.ink};background:${c.box};margin-top:0">
					<span class="num" style="color:${c.accent}">${cs?cs.ruleNum:a.ruleNum}</span>${th.rules[(cs?cs.ruleNum:a.ruleNum)-1]}</div>`) : ""}
				${disclose("at-comments-"+commentKey, "COMMENTS", commentCount + (commentCount===1?" comment":" comments"), `
					<div style="display:flex;justify-content:flex-end;margin-bottom:2px"><span class="addc" style="color:${c.accent}" data-action="addComment" data-thread="${params.thread||"pizza"}" data-attemptidx="${params.attemptidx||0}">+ ADD</span></div>
					${comments}`, true)}
			</div>
		</div>
		${capsuleNav("explore")}
	</div>`;
};

/* ============ OPEN A CASE (CHALLENGE FLOW) ============ */
const CHALLENGE_CLAIM_FILL = "The rule is not decoration. Read as written, this post steps over the line the thread drew — and 'clever' has never been the same word as 'allowed.'";

/* one-tap fill bends, one per thread, each aimed at its own rules */
const ATTEMPT_FILLS = {
	pizza: "If the tomato is a fruit and nobody objects to it on pizza, what exactly is the pineapple accused of?",
	coffee: "The bean juice does my job for me until nine. After that I am purely decorative.",
	compliments: "You have to hand it to Mondays — no other day commits so completely to its work.",

	ama: "I have never once lost this argument in a dream.",
	movies: "A retired widower's grief counseling proceeds through the firearms section.",
	haiku: "The printer at work / believes in paper the way / I believe in it",
	sellme: "This umbrella has survived every storm it has ever been through.",

screens.challenge = function(params) {
	const c = t();
	const th = THREADS[params.thread];
	const a = th.attempts[params.attemptidx];
	const step = params.step || "rule";
	const escalating = step === "brehon" || step === "surety";
	const stepIdx = { rule:0, claim:1, demand:2, sent:2, brehon:0, surety:1, done:1 }[step];
	const nDots = escalating || step === "done" ? 2 : 3;
	const dots = [...Array(nDots)].map((_, i) => `<div class="pdot" style="background:${i<=stepIdx?c.accent:c.hair}"></div>`).join("");
	const attemptQuote = `<div class="attempt-quote" style="border-color:${c.accent};color:${c.ink}">${a.body}</div>
		<div class="attempt-by" style="color:${c.muted}">&mdash; ${a.author}, in &ldquo;${th.title}&rdquo;</div>`;
	const nav = (toStep) => `data-action="go" data-screen="challenge" data-thread="${params.thread}" data-attemptidx="${params.attemptidx}" data-step="${toStep}"`;
	let body, cta;
	if (step === "rule") {
		const choices = th.rules.map((r,i) => {
			const on = challenge.rule === i+1;
			return `<div class="disc-row" style="border-color:${c.hair}" data-action="setChallengeRule" data-rule="${i+1}">
				<span style="display:flex;gap:8px;align-items:baseline"><span class="num" style="color:${c.accent}">${i+1}</span><span style="color:${c.ink};font-family:Palatino,Georgia,serif;font-size:14px">${r}</span></span>
				<span style="color:${on?c.accent:c.muted};font-weight:800;flex-shrink:0">${on?"&#10003;":""}</span>
			</div>`;
		}).join("");
		body = `<div class="sec-label" style="color:${c.muted}">THE BEND YOU'RE CHALLENGING</div>${attemptQuote}
			<div class="sec-label" style="color:${c.muted};margin-top:20px">WHICH RULE DID IT BREAK?</div>${choices}`;
		cta = `<div class="submit-btn" style="background:${challenge.rule?c.accent:c.hair};color:${challenge.rule?c.accentInk:c.muted}" ${challenge.rule?nav("claim"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "claim") {
		body = `<div class="sec-label" style="color:${c.muted}">YOUR CLAIM</div>
			<div class="helper" style="color:${c.muted}">Argue it yourself, or bring an advocate later. Say in your own words why this broke Rule ${challenge.rule}.</div>
			<div class="textarea" style="border-color:${c.hair};color:${filled.challengeClaim?c.ink:c.muted}" data-action="fillField" data-field="challengeClaim">${filled.challengeClaim?CHALLENGE_CLAIM_FILL:"Make your case&hellip;"}</div>
			<div class="charcount" style="color:${c.muted}">${filled.challengeClaim?CHALLENGE_CLAIM_FILL.length:0} / 400</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" ${nav("demand")}>CONTINUE &rsaquo;</div>`;
	} else if (step === "demand") {
		const rung = (label, amt, note, on) => `<div style="display:flex;justify-content:space-between;padding:8px 0;${on?"":"border-top:1px dotted "+c.dotted}">
			<span style="font-family:Helvetica,sans-serif;font-size:12px;font-weight:${on?"800":"700"};letter-spacing:.08em;color:${on?c.accent:c.muted}">${label}</span>
			<span style="font-family:'SF Mono',Menlo,monospace;font-size:12px;font-weight:${on?"800":"600"};color:${on?c.ink:c.muted}">${amt}</span>
			<span style="font-family:Helvetica,sans-serif;font-size:10.5px;color:${c.muted};flex:1;text-align:right;margin-left:12px">${note}</span>
		</div>`;
		body = `<div class="sec-label" style="color:${c.muted}">SEND THE DEMAND &middot; $0</div>
			<div class="helper" style="color:${c.muted}">Your claim goes to ${a.author}. They can cure the bend, concede it, or refuse. Money enters only if you escalate.</div>
			<div style="margin-top:12px;padding:6px 16px 8px;border:1px solid ${c.hair}">
				${rung("TALK", "$0", "glosses, comments &mdash; always", false)}
				${rung("PARLEY", "$0", "this demand", true)}
				${rung("SETTLE", "$6 each", "if it escalates and advocates settle", false)}
				${rung("RULED", "$11 loser", "winner pays $0", false)}
			</div>
			<div class="gloss-body" style="color:${c.ink};margin-top:16px">${filled.challengeClaim?CHALLENGE_CLAIM_FILL:"This breaks the rule as written."}</div>
			<div class="attempt-by" style="color:${c.muted}">&mdash; your demand, on the record &middot; 48h to reply</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="sendDemand" data-thread="${params.thread}" data-attemptidx="${params.attemptidx}">SEND &middot; $0</div>`;
	} else if (step === "sent") {
		const code = a.case;
		body = `<div class="pending-box" style="border-color:${c.hair}">
				<div class="pending-title">Demand sent</div>
				<div class="pending-sub" style="color:${c.muted}">$0 staked, nothing at risk. ${a.author} has 48h to cure the bend, concede it, or refuse. Refusal &mdash; or silence &mdash; unlocks escalation.</div>
				<div class="pending-stamp" style="color:${c.accent}">^${code} &middot; DEMAND OPEN</div>
			</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="go" data-screen="casedetail" data-case="${code}">VIEW THE DEMAND &rsaquo;</div>`;
	} else if (step === "brehon") {
		const cards = BREHONS.map(([ini,name,avail,fav,stats,spec]) => {
			const on = challenge.brehon === name;
			return `<div class="brehon-card" style="border-color:${on?c.accent:c.hair}" data-action="setChallengeBrehon" data-brehon="${name}">
				<div class="bmark">${ringedSiglum(c,ini,44,false)}</div>
				<div class="bbody">
					<div class="brow1"><span class="bname" style="color:${c.ink}">${name}</span>${on?`<span class="bfav" style="color:${c.accent}">&#10003;</span>`:""}</div>
					<div class="bstats" style="color:${c.muted}">${stats}</div>
					<div class="bspec" style="color:${c.ink}">${spec}</div>
				</div>
			</div>`;
		}).join("");
		body = `<div class="sec-label" style="color:${c.muted}">RETAIN YOUR ADVOCATE</div>
			<div class="helper" style="color:${c.muted}">Pick who argues your side. ${a.author} retains their own; the two try to settle first.</div>
			${cards}`;
		cta = `<div class="submit-btn" style="background:${challenge.brehon?c.accent:c.hair};color:${challenge.brehon?c.accentInk:c.muted}" ${challenge.brehon?nav("surety"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "surety") {
		const feeRow = (label, amt, strong) => `<div style="display:flex;justify-content:space-between;padding:8px 0;${strong?"":"border-top:1px dotted "+c.dotted}">
			<span style="color:${strong?c.ink:c.muted};font-weight:${strong?"800":"400"};font-family:Helvetica,sans-serif;font-size:${strong?"12.5":"12"}px">${label}</span>
			<span style="color:${strong?c.ink:c.muted};font-weight:${strong?"800":"600"};font-family:'SF Mono',Menlo,monospace;font-size:12.5px">${amt}</span></div>`;
		body = `<div class="sec-label" style="color:${c.muted}">POST YOUR BOND</div>
			<div style="margin-top:12px;padding:13px 16px;border:1px solid ${c.hair}">
				${feeRow("BOND", "$20", true)}
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.bent};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if you win or settle</span><span style="color:${c.bent};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">refunded</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.red};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if you lose</span><span style="color:${c.red};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">&minus;$11 costs</span></div>
			</div>
			${bondGate(20, challenge.surety, `data-action="putUpSurety"`, "POST")}`;
		cta = `<div class="submit-btn" style="background:${challenge.surety?c.accent:c.hair};color:${challenge.surety?c.accentInk:c.muted}" ${challenge.surety?`data-action="finalizeChallenge" data-thread="${params.thread}" data-attemptidx="${params.attemptidx}"`:""}>ISSUE THE CHALLENGE</div>`;
	} else {
		const code = a.case;
		body = `<div class="pending-box" style="border-color:${c.hair}">
				<div class="pending-title">Challenge issued</div>
				<div class="pending-sub" style="color:${c.muted}">On the board with your $20 bond staked and ${challenge.brehon||"your advocate"} retained. It becomes a case when ${a.author} contests &mdash; posts a matching bond and retains their own advocate.</div>
				<div class="pending-stamp" style="color:${c.accent}">^${code} &middot; AWAITING A DEFENDER</div>
			</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="go" data-screen="casedetail" data-case="${code}">VIEW THE CASE &rsaquo;</div>
			<div class="cta-sub" style="color:${c.accent}" data-action="goTab" data-screen="cases">or find it later in My Cases</div>`;
	}
	const headTitle = step==="done" ? "CHALLENGE ISSUED" : step==="sent" ? "DEMAND SENT"
		: escalating ? "ESCALATE &middot; " + (stepIdx+1) + " OF 2"
		: "PARLEY &middot; " + (stepIdx+1) + " OF 3";
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead(headTitle)}
		${step==="done"||step==="sent"?"":`<div style="padding:12px 24px 0"><div class="progress">${dots}</div></div>`}
		<div class="folio">${body}<div style="margin-top:22px">${cta}</div></div>
	</div>`;
};

/* ============ CONTEST A CHALLENGE (DEFENDER FLOW) ============ */
const CHALLENGER_CLAIM = "A rhetorical sneer is not an inquiry. Rule 1 asks for questions, and a sneer that ends in a question mark is still a sneer.";

/* deliberation outcomes for cases the signed-in user is party to */

		ruledVerdict:"BENT", ruledHolding:"'Civilized' aims at taste, not at a person. Rule 2 guards people; palates can fend for themselves.",
		defaultVerdict:"BENT", defaultHolding:"Default judgment — the challenger's clock fell. The defender's final offer is enacted: the bend stands." },
	TX55VB: { you:"def", offers:{ chal:"EDIT", def:"KEEP" }, clocks:{ mine:"38h", theirs:"12h" },

screens.contest = function(params) {
	const c = t();
	const code = params.case;
	const cs = CASES[code];
	const th = THREADS[cs.thread];
	const step = params.step || "review";
	const stepIdx = { review:0, bond:1, advocate:2, done:2, lapsed:0 }[step];
	const dots = [0,1,2].map(i => `<div class="pdot" style="background:${i<=stepIdx?c.accent:c.hair}"></div>`).join("");
	const nav = (toStep) => `data-action="go" data-screen="contest" data-case="${code}" data-step="${toStep}"`;
	let body, cta;
	if (step === "review") {
		body = `<div class="sec-label" style="color:${c.muted}">YOUR BEND, UNDER CHALLENGE</div>
			<div class="attempt-quote" style="border-color:${c.accent};color:${c.ink}">${cs.attempt}</div>
			<div class="sec-label" style="color:${c.red};margin-top:18px">RULE BROKEN</div>
			<div class="rule-cited" style="border-color:${c.accent};color:${c.ink};background:${c.box};margin-top:8px">
				<span class="num" style="color:${c.accent}">${cs.ruleNum}</span>${th.rules[cs.ruleNum-1]}</div>
			<div class="sec-label" style="color:${c.muted};margin-top:18px">${cs.chal.toUpperCase()} &middot; CHALLENGER</div>
			<div class="gloss-body" style="color:${c.ink};margin-top:6px">${CHALLENGER_CLAIM}</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" ${nav("bond")}>CONTEST &rsaquo;</div>
			<div class="cta-sub" style="color:${c.muted};cursor:pointer" data-action="lapseCase" data-case="${code}">or let it lapse &mdash; the bend is hidden, nobody pays</div>`;
	} else if (step === "bond") {
		const covered = defense.bond || defense.backer;
		const backerCards = BACKERS.map(([ini, name, prem, blurb]) => {
			const on = defense.backer === name;
			return `<div class="brehon-card" style="border-color:${on?c.accent:c.hair}" data-action="retainBacker" data-backer="${name}">
				<div class="bmark">${ringedSiglum(c, ini, 44, false)}</div>
				<div class="bbody">
					<div class="brow1"><span class="bname" style="color:${c.ink}">${name}</span><span class="bfav" style="color:${on?c.accent:c.muted};font-size:11px;font-family:'SF Mono',Menlo,monospace;font-weight:700">${on?"&#10003; ":""}${prem} premium</span></div>
					<div class="bspec" style="color:${c.ink}">${blurb}</div>
					<div class="bstats" style="color:${c.muted};margin-top:5px">They post the $20 &middot; you pay ${prem}, win or lose &middot; premiums capped at $5</div>
				</div>
			</div>`;
		}).join("");
		body = `<div class="sec-label" style="color:${c.muted}">COVER THE BOND &middot; $20</div>
			<div style="margin-top:12px;padding:13px 16px;border:1px solid ${c.hair}">
				<div style="display:flex;justify-content:space-between;padding:8px 0"><span style="color:${c.ink};font-weight:800;font-family:Helvetica,sans-serif;font-size:12.5px">YOUR BOND</span><span style="color:${c.ink};font-weight:800;font-family:'SF Mono',Menlo,monospace;font-size:12.5px">$20</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.bent};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if you win or settle</span><span style="color:${c.bent};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">refunded</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.red};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if you lose</span><span style="color:${c.red};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">&minus;$11 costs</span></div>
			</div>
			${bondGate(20, defense.bond, `data-action="postDefBond"`, "POST")}
			<div class="sec-label" style="color:${c.muted};margin-top:22px">OR RETAIN A BACKER</div>
			<div class="helper" style="color:${c.muted}">Can't front $20? A backer posts it and eats the loss if you lose; your only cost is their premium. Backers must be retained by you &mdash; nobody bets on strangers' cases.</div>
			${backerCards}`;
		cta = `<div class="submit-btn" style="background:${covered?c.accent:c.hair};color:${covered?c.accentInk:c.muted}" ${covered?nav("advocate"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "advocate") {
		const cards = BREHONS.filter(([,name]) => name !== cs.chalBrehon).map(([ini,name,avail,fav,stats,spec]) => {
			const on = defense.advocate === name;
			return `<div class="brehon-card" style="border-color:${on?c.accent:c.hair}" data-action="setDefAdvocate" data-advocate="${name}">
				<div class="bmark">${ringedSiglum(c,ini,44,false)}</div>
				<div class="bbody">
					<div class="brow1"><span class="bname" style="color:${c.ink}">${name}</span>${on?`<span class="bfav" style="color:${c.accent}">&#10003;</span>`:""}</div>
					<div class="bstats" style="color:${c.muted}">${stats}</div>
					<div class="bspec" style="color:${c.ink}">${spec}</div>
				</div>
			</div>`;
		}).join("");
		body = `<div class="sec-label" style="color:${c.muted}">RETAIN YOUR ADVOCATE</div>
			<div class="helper" style="color:${c.muted}">${cs.chal} retained ${cs.chalBrehon}. Yours argues your side; the two try to settle first.</div>
			${cards}`;
		cta = `<div class="submit-btn" style="background:${defense.advocate?c.accent:c.hair};color:${defense.advocate?c.accentInk:c.muted}" ${defense.advocate?`data-action="finalizeContest" data-case="${code}"`:""}>ENTER DELIBERATION</div>`;
	} else if (step === "done") {
		body = `<div class="pending-box" style="border-color:${c.hair}">
				<div class="pending-title">You're in deliberation</div>
				<div class="pending-sub" style="color:${c.muted}">${defense.backer?defense.backer+" posted your $20; your only stake is the premium. ":""}${defense.advocate} and ${cs.chalBrehon} now try to settle. If they deadlock, an adjudicator you both consent to picks one side's final offer &mdash; nothing in between.</div>
				<div class="pending-stamp" style="color:${c.accent}">^${code} &middot; IN DELIBERATION</div>
			</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="go" data-screen="transcript" data-case="${code}">FOLLOW THE DELIBERATION &rsaquo;</div>`;
	} else {
		body = `<div class="pending-box" style="border-color:${c.hair}">
				<div class="pending-title">Lapsed &mdash; undefended</div>
				<div class="pending-sub" style="color:${c.muted}">The bend is soft-hidden, marked &ldquo;challenged, undefended.&rdquo; ${cs.chal}'s bond returns in full. Nobody pays a fee.</div>
				<div class="pending-stamp" style="color:${c.muted}">^${code} &middot; UNDEFENDED</div>
			</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="goTab" data-screen="cases">BACK TO MY CASES</div>`;
	}
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead(step==="lapsed"?"UNDEFENDED":"CONTEST &middot; " + (stepIdx+1) + " OF 3")}
		${step==="done"||step==="lapsed"?"":`<div style="padding:12px 24px 0"><div class="progress">${dots}</div></div>`}
		<div class="folio">${body}<div style="margin-top:22px">${cta}</div></div>
	</div>`;
};

/* ============ SEAT AN ADJUDICATOR (DEADLOCK) ============ */
screens.seatadj = function(params) {
	const c = t();
	const code = params.case;
	const cs = CASES[code];
	const cards = BREHONS.filter(([,name]) => name !== cs.chalBrehon && name !== cs.defBrehon && name !== cs.chal && name !== cs.def).map(([ini,name,avail,fav,stats,spec]) => {
		const on = adjPick === name;
		return `<div class="brehon-card" style="border-color:${on?c.accent:c.hair}" data-action="pickAdj" data-adj="${name}">
			<div class="bmark">${ringedSiglum(c,ini,44,false)}</div>
			<div class="bbody">
				<div class="brow1"><span class="bname" style="color:${c.ink}">${name}</span>${on?`<span class="bfav" style="color:${c.accent}">&#10003;</span>`:""}</div>
				<div class="bstats" style="color:${c.muted}">${stats}</div>
				<div class="bspec" style="color:${c.ink}">${spec}</div>
			</div>
		</div>`;
	}).join("");
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead("DEADLOCK &middot; SEAT AN ADJUDICATOR")}
		<div class="folio">
			<div class="helper" style="color:${c.muted}">The advocates couldn't settle. Both sides must consent to one adjudicator &mdash; independent of both advocates &mdash; who picks one final offer verbatim. Nothing in between.</div>
			${cards}
			<div style="margin-top:22px">
				<div class="submit-btn" style="background:${adjPick?c.accent:c.hair};color:${adjPick?c.accentInk:c.muted}" ${adjPick?`data-action="seatAdjudicator" data-case="${code}"`:""}>SEAT BY MUTUAL CONSENT &rsaquo;</div>
			</div>
		</div>
	</div>`;
};

/* ============ APPEAL (A FRESH CASE ABOUT THE RULING) ============ */
screens.appeal = function(params) {
	const c = t();
	const code = params.case;
	const cs = CASES[code];
	const winnerName = cs.verdict === "BENT" ? cs.def : cs.chal;
	const step = params.step || "grounds";
	const stepIdx = { grounds:0, stakes:1, advocate:2, done:2 }[step];
	const dots = [0,1,2].map(i => `<div class="pdot" style="background:${i<=stepIdx?c.accent:c.hair}"></div>`).join("");
	const nav = (toStep) => `data-action="go" data-screen="appeal" data-case="${code}" data-step="${toStep}"`;
	let body, cta;
	if (step === "grounds") {
		const opt = (kind, word, sub, consequence) => `<div class="brehon-card" style="border-color:${appeal.kind===kind?c.accent:c.hair};cursor:pointer" data-action="setAppealKind" data-kind="${kind}">
			<div class="bbody">
				<div class="brow1"><span class="bname" style="color:${c.ink}">${word}</span>${appeal.kind===kind?`<span class="bfav" style="color:${c.accent}">&#10003;</span>`:""}</div>
				<div class="bspec" style="color:${c.ink}">${sub}</div>
				<div class="bstats" style="color:${c.muted};margin-top:6px">${consequence}</div>
			</div>
		</div>`;
		body = `<div class="sec-label" style="color:${c.muted}">THE RULING YOU'RE APPEALING</div>
			<div class="attempt-quote" style="border-color:${c.accent};color:${c.ink}">${rubric(c, cs.holding)}</div>
			<div class="attempt-by" style="color:${c.muted}">&mdash; ${cs.adj}, adjudicator &middot; ^${code}</div>
			<div class="sec-label" style="color:${c.muted};margin-top:20px">ON WHAT GROUND?</div>
			${opt("merits", "On the merits", "The ruling weighed it wrongly. You argue against " + winnerName + " again, fresh.", cs.adj + " keeps their fee &middot; no honor event &middot; being reversed on judgment is not dishonor")}
			${opt("cause", "For cause", "The adjudicator broke faith &mdash; concealed conflict, ignored evidence, or gave no written reasons.", "you argue against " + cs.adj + " &middot; if you prevail: fee clawed back &middot; their honor falls")}`;
		cta = `<div class="submit-btn" style="background:${appeal.kind?c.accent:c.hair};color:${appeal.kind?c.accentInk:c.muted}" ${appeal.kind?nav("stakes"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "stakes") {
		body = `<div class="sec-label" style="color:${c.muted}">POST THE APPEAL BOND &middot; STAKES DOUBLE</div>
			<div style="margin-top:12px;padding:13px 16px;border:1px solid ${c.hair}">
				<div style="display:flex;justify-content:space-between;padding:8px 0"><span style="color:${c.ink};font-weight:800;font-family:Helvetica,sans-serif;font-size:12.5px">BOND &middot; 2&times;</span><span style="color:${c.ink};font-weight:800;font-family:'SF Mono',Menlo,monospace;font-size:12.5px">$40</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.bent};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if the appeal prevails</span><span style="color:${c.bent};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">refunded &middot; ruling reversed</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.red};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if it fails</span><span style="color:${c.red};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">&minus;$22 costs</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.muted};font-family:Helvetica,sans-serif;font-size:11px">the appeal after this one</span><span style="color:${c.muted};font-family:'SF Mono',Menlo,monospace;font-size:11px">$80 &rarr; $160 &rarr; &hellip;</span></div>
			</div>
			${bondGate(40, appeal.bond, `data-action="postAppealBond"`, "POST")}`;
		cta = `<div class="submit-btn" style="background:${appeal.bond?c.accent:c.hair};color:${appeal.bond?c.accentInk:c.muted}" ${appeal.bond?nav("advocate"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "advocate") {
		const excluded = [cs.chalBrehon, cs.defBrehon, cs.adj, cs.chal, cs.def];
		const cards = BREHONS.filter(([,name]) => !excluded.includes(name)).map(([ini,name,avail,fav,stats,spec]) => {
			const on = appeal.advocate === name;
			return `<div class="brehon-card" style="border-color:${on?c.accent:c.hair}" data-action="setAppealAdvocate" data-advocate="${name}">
				<div class="bmark">${ringedSiglum(c,ini,44,false)}</div>
				<div class="bbody">
					<div class="brow1"><span class="bname" style="color:${c.ink}">${name}</span>${on?`<span class="bfav" style="color:${c.accent}">&#10003;</span>`:""}</div>
					<div class="bstats" style="color:${c.muted}">${stats}</div>
					<div class="bspec" style="color:${c.ink}">${spec}</div>
				</div>
			</div>`;
		}).join("");
		body = `<div class="sec-label" style="color:${c.muted}">RETAIN A FRESH ADVOCATE</div>
			<div class="helper" style="color:${c.muted}">Everyone from ^${code} is out &mdash; parties, advocates, adjudicator. An appeal is a new peer case, not a return visit.</div>
			${cards}`;
		cta = `<div class="submit-btn" style="background:${appeal.advocate?c.accent:c.hair};color:${appeal.advocate?c.accentInk:c.muted}" ${appeal.advocate?`data-action="finalizeAppeal" data-case="${code}"`:""}>FILE THE APPEAL</div>`;
	} else {
		const ap = params.ap;
		const apCase = CASES[ap];
		body = `<div class="pending-box" style="border-color:${c.hair}">
				<div class="pending-title">Appeal filed</div>
				<div class="pending-sub" style="color:${c.muted}">^${ap} is a new case whose subject is the ruling in ^${code} &mdash; no court above, just peers at doubled stakes. ${apCase.def} has 5 days to contest with a matching $40 bond.</div>
				<div class="pending-stamp" style="color:${c.accent}">^${ap} &middot; ${appeal.kind==="cause"?"FOR CAUSE":"ON THE MERITS"} &middot; AWAITING A DEFENDER</div>
			</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="go" data-screen="casedetail" data-case="${ap}">VIEW THE APPEAL &rsaquo;</div>
			<div class="cta-sub" style="color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${code}">or back to ^${code}</div>`;
	}
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead(step==="done"?"APPEAL FILED":"APPEAL &middot; " + (stepIdx+1) + " OF 3")}
		${step==="done"?"":`<div style="padding:12px 24px 0"><div class="progress">${dots}</div></div>`}
		<div class="folio">${body}<div style="margin-top:22px">${cta}</div></div>
	</div>`;
};

/* ============ RULE-VALIDITY REVIEW ============ */
screens.rulereview = function(params) {
	const c = t();
	const th = THREADS[params.thread];
	const step = params.step || "rule";
	const stepIdx = { rule:0, ground:1, advocate:2, bond:3, done:3 }[step];
	const dots = [0,1,2,3].map(i => `<div class="pdot" style="background:${i<=stepIdx?c.accent:c.hair}"></div>`).join("");
	const nav = (toStep) => `data-action="go" data-screen="rulereview" data-thread="${params.thread}" data-step="${toStep}"`;
	let body, cta;
	if (step === "rule") {
		const rows = th.rules.map((r,i) => {
			const on = rv.rule === i+1;
			return `<div class="disc-row" style="border-color:${c.hair}" data-action="setRVRule" data-rule="${i+1}">
				<span style="display:flex;gap:8px;align-items:baseline"><span class="num" style="color:${c.accent}">${i+1}</span><span style="color:${c.ink};font-family:Palatino,Georgia,serif;font-size:14px">${r}</span></span>
				<span style="color:${on?c.accent:c.muted};font-weight:800;flex-shrink:0">${on?"&#10003;":""}</span>
			</div>`;
		}).join("");
		body = `<div class="sec-label" style="color:${c.muted}">WHICH RULE IS INVALID?</div>
			<div class="helper" style="color:${c.muted}">Not how it was applied &mdash; whether it can validly be a rule at all.</div>${rows}`;
		cta = `<div class="submit-btn" style="background:${rv.rule?c.accent:c.hair};color:${rv.rule?c.accentInk:c.muted}" ${rv.rule?nav("ground"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "ground") {
		const cards = RV_GROUNDS.map(([id, word, sub]) => `<div class="brehon-card" style="border-color:${rv.ground===id?c.accent:c.hair};cursor:pointer" data-action="setRVGround" data-ground="${id}">
			<div class="bbody">
				<div class="brow1"><span class="bname" style="color:${c.ink}">${word}</span>${rv.ground===id?`<span class="bfav" style="color:${c.accent}">&#10003;</span>`:""}</div>
				<div class="bspec" style="color:${c.ink}">${sub}</div>
			</div>
		</div>`).join("");
		body = `<div class="sec-label" style="color:${c.muted}">THE RULE UNDER REVIEW</div>
			<div class="rule-cited" style="border-color:${c.accent};color:${c.ink};background:${c.box}">
				<span class="num" style="color:${c.accent}">${rv.rule}</span>${th.rules[rv.rule-1]}</div>
			<div class="sec-label" style="color:${c.muted};margin-top:20px">ON WHICH GROUND?</div>${cards}`;
		cta = `<div class="submit-btn" style="background:${rv.ground?c.accent:c.hair};color:${rv.ground?c.accentInk:c.muted}" ${rv.ground?nav("advocate"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "advocate") {
		const cards = BREHONS.filter(([,name]) => name !== th.author).map(([ini,name,avail,fav,stats,spec]) => {
			const on = rv.advocate === name;
			return `<div class="brehon-card" style="border-color:${on?c.accent:c.hair}" data-action="setRVAdvocate" data-advocate="${name}">
				<div class="bmark">${ringedSiglum(c,ini,44,false)}</div>
				<div class="bbody">
					<div class="brow1"><span class="bname" style="color:${c.ink}">${name}</span>${on?`<span class="bfav" style="color:${c.accent}">&#10003;</span>`:""}</div>
					<div class="bstats" style="color:${c.muted}">${stats}</div>
					<div class="bspec" style="color:${c.ink}">${spec}</div>
				</div>
			</div>`;
		}).join("");
		body = `<div class="sec-label" style="color:${c.muted}">RETAIN YOUR ADVOCATE</div>
			<div class="helper" style="color:${c.muted}">A rule review is an ordinary case &mdash; no constitutional court exists. ${th.author}, who wrote the rule, defends it.</div>
			${cards}`;
		cta = `<div class="submit-btn" style="background:${rv.advocate?c.accent:c.hair};color:${rv.advocate?c.accentInk:c.muted}" ${rv.advocate?nav("bond"):""}>CONTINUE &rsaquo;</div>`;
	} else if (step === "bond") {
		body = `<div class="sec-label" style="color:${c.muted}">POST YOUR BOND</div>
			<div style="margin-top:12px;padding:13px 16px;border:1px solid ${c.hair}">
				<div style="display:flex;justify-content:space-between;padding:8px 0"><span style="color:${c.ink};font-weight:800;font-family:Helvetica,sans-serif;font-size:12.5px">BOND</span><span style="color:${c.ink};font-weight:800;font-family:'SF Mono',Menlo,monospace;font-size:12.5px">$20</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.bent};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if the rule falls or you settle</span><span style="color:${c.bent};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">refunded</span></div>
				<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px dotted ${c.dotted}"><span style="color:${c.red};font-family:Helvetica,sans-serif;font-size:12px;font-weight:700">if the rule stands</span><span style="color:${c.red};font-family:'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:800">&minus;$11 costs</span></div>
			</div>
			${bondGate(20, rv.bond, `data-action="postRVBond"`, "POST")}`;
		cta = `<div class="submit-btn" style="background:${rv.bond?c.accent:c.hair};color:${rv.bond?c.accentInk:c.muted}" ${rv.bond?`data-action="finalizeRuleReview" data-thread="${params.thread}"`:""}>FILE THE REVIEW</div>`;
	} else {
		const code = params.rvcase;
		body = `<div class="pending-box" style="border-color:${c.hair}">
				<div class="pending-title">Review filed</div>
				<div class="pending-sub" style="color:${c.muted}">^${code} challenges Rule ${rv.rule} for ${rv.ground}. ${th.author} defends the rule they wrote &mdash; the same bonds, advocates, and deadlock path as any case. If the rule falls, it falls only here, in this thread.</div>
				<div class="pending-stamp" style="color:${c.accent}">^${code} &middot; RULE-VALIDITY REVIEW</div>
			</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="go" data-screen="casedetail" data-case="${code}">VIEW THE CASE &rsaquo;</div>
			<div class="cta-sub" style="color:${c.accent}" data-action="go" data-screen="thread" data-thread="${params.thread}">back to the thread</div>`;
	}
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead(step==="done"?"REVIEW FILED":"REVIEW A RULE &middot; " + (stepIdx+1) + " OF 4")}
		${step==="done"?"":`<div style="padding:12px 24px 0"><div class="progress">${dots}</div></div>`}
		<div class="folio">${body}<div style="margin-top:22px">${cta}</div></div>
	</div>`;
};

/* money receipts for a case's HISTORY */
function receiptLines(cs) {
	const th = THREADS[cs.thread] || {};
	const fromBudget = th.owner ? " &middot; paid from owner budget" : "";
	const L = [];
	if (cs.clocksPaused) L.push(["Clocks paused 41m &mdash; platform fault", "time charged to no one"]);
	if (cs.status === "cured" || cs.status === "conceded" || cs.status === "demand" || cs.status === "refused") { L.push(["Resolved at $0 &mdash; no bonds, no fees", ""]); return L; }
	if (cs.status === "pending") { L.push(["Bond posted &mdash; " + money(cs.parent ? 40 : 20), cs.chal]); return L; }
	if (cs.status === "ongoing") { L.push(["Bond posted &mdash; $20.00", cs.chal], ["Bond posted &mdash; $20.00", cs.def]); return L; }
	if (cs.status === "undefended") { L.push(["Bond returned &mdash; $20.00", cs.chal]); return L; }
	if (cs.status !== "resolved") return L;
	const winnerName = cs.verdict === "BENT" ? cs.def : cs.chal;
	const loserName = cs.verdict === "BENT" ? cs.chal : cs.def;
	const winAdv = cs.verdict === "BENT" ? cs.defBrehon : cs.chalBrehon;
	const loseAdv = cs.verdict === "BENT" ? cs.chalBrehon : cs.defBrehon;
	if (cs.adj) {
		L.push(["Bond returned &mdash; $20.00 &middot; " + (winnerName === "Harry Potter" ? "you paid $0" : "paid $0"), winnerName]);
		L.push(["Ruled against &mdash; $11.00 &middot; $9.00 returned", loserName]);
		L.push(["Advocate wage &mdash; $5.00" + fromBudget, "&rarr; " + (winAdv || "")]);
		L.push(["Advocate fee forfeited (losing side)", loseAdv || ""]);
		L.push(["Adjudicator fee &mdash; $4.00" + fromBudget, "&rarr; " + cs.adj]);
		L.push(["Platform fee &mdash; $2.00", ""]);
	} else if (cs.defaulted) {
		L.push(["Bond returned &mdash; $20.00 &middot; " + (winnerName === "Harry Potter" ? "you paid $0" : "paid $0"), winnerName]);
		L.push(["Defaulted &mdash; $7.00 &middot; $13.00 returned", loserName]);
		L.push(["Advocate wage &mdash; $5.00" + fromBudget, "&rarr; " + (winAdv || "")]);
		L.push(["Platform fee &mdash; $2.00", ""]);
	} else {
		L.push(["Settled &mdash; $6.00 each", cs.chal + " &middot; " + cs.def]);
		L.push(["Advocate wages &mdash; $5.00 each" + fromBudget, (cs.chalBrehon || "") + " &middot; " + (cs.defBrehon || "")]);
		L.push(["Platform fee &mdash; $2.00 &middot; split", ""]);
	}
	return L;
}

/* ============ CASES (MY CASES) ============ */
screens.cases = function() {
	const c = t();
	const row = (r) => `<div class="citem" style="border-color:${c.hair}" data-action="go" data-screen="casedetail" data-case="${r.code}">
			<div class="crow1" style="color:${c.muted}"><span class="role" style="color:${c.accent}">${r.role}</span><span>vs ${r.vs}</span></div>
			<div class="cquote" style="border-color:${c.dotted};color:${c.ink}">${r.quote}</div>
			<div class="cfoot" style="color:${r.metaColor?c[r.metaColor]:c.muted}">
				<span>${r.meta}</span><span class="ccode" style="color:${c.muted}">^${r.code}</span>
			</div>
		</div>`;
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		<div class="pagehead"><div class="pagerow"><span class="pagetitle">My Cases</span></div>
			<div class="sortrow" style="color:${c.muted}">ALL &nbsp;&middot;&nbsp; PENDING &nbsp;&middot;&nbsp; RESOLVED</div>
		</div>
		<div class="feed" style="overflow-y:auto">
			<div class="sechead" style="color:${c.muted}">${CASES.TX55VB.status==="pending"?"PENDING":CASES.TX55VB.status==="undefended"?"LAPSED":"ONGOING"}</div>
			${row(CASES.TX55VB.status==="pending"?CASE_LIST_ROWS.pending
				:CASES.TX55VB.status==="undefended"?{ ...CASE_LIST_ROWS.pending, meta:"&#9711; Lapsed &mdash; undefended, bend hidden", metaColor:null }
				:{ ...CASE_LIST_ROWS.pending, meta:"&#9679; In deliberation &middot; 5 days left", metaColor:"bent" })}
			<div class="sechead" style="color:${c.muted}">${CASES.QF83RN.status==="resolved"?"JUST RESOLVED":"ONGOING"}</div>
			${row(CASES.QF83RN.status==="resolved"
				?{ ...CASE_LIST_ROWS.active, meta:"&#10003; Resolved &middot; "+CASES.QF83RN.verdict+" &middot; "+(CASES.QF83RN.adj?"ruled":"settled")+" today", metaColor:CASES.QF83RN.verdict==="BENT"?"bent":"red" }
				:CASE_LIST_ROWS.active)}
			<div class="sechead" style="color:${c.muted}">RESOLVED</div>
			${row(CASE_LIST_ROWS.resolved1)}
			${row(CASE_LIST_ROWS.resolved2)}
			<div class="sechead" style="color:${c.muted}">RESOLVED AT $0</div>
			${row({ role:"DEMANDED", vs:"George Weasley", quote:"This spatula has survived every argument in our kitchen.", meta:"&#10003; Cured &middot; $0 &middot; edited to comply", metaColor:"bent", code:"CU55TN" })}
			${row({ role:"DEMANDED", vs:"Ron Weasley", quote:"My weekend was Saturday and then Sunday, which is technically one sentence&hellip;", meta:"&#10003; Conceded &middot; $0 &middot; taken down", code:"CN71RD" })}
		</div>
		${capsuleNav("cases")}
	</div>`;
};

/* ============ CASE DETAIL ============ */
screens.casedetail = function(params) {
	const c = t();
	const code = params.case || "AB12CD";
	const cs = CASES[code];
	const resolved = cs.status === "resolved";
	const ruled = resolved && !!cs.adj;
	const state = resolved ? (ruled ? "RULED" : cs.defaulted ? "DEFAULT JUDGMENT" : "SETTLED")
		: cs.status === "pending" ? "AWAITING DEFENDER"
		: cs.status === "undefended" ? "UNDEFENDED"
		: cs.status === "demand" ? "DEMAND OPEN"
		: cs.status === "refused" ? "DEMAND REFUSED"
		: cs.status === "cured" ? "CURED"
		: cs.status === "conceded" ? "CONCEDED"
		: "IN DELIBERATION";
	const youDefend = cs.status === "pending" && cs.def === "Harry Potter";
	const vc = resolved ? verdictColor(c, cs.verdict) : c.amber;
	const accepted = !!(cs.chalBrehon && cs.defBrehon);
	const winner = cs.verdict === "BENT" ? "def" : "chal";
	const timeline = [
		{ label:"Challenge issued", when:cs.filed, done:true },
		{ label:"Contested &middot; both advocates in", when: accepted ? "in" : (cs.status==="pending" ? "awaiting" : "&mdash;"), done: accepted },
		{ label:"Deliberation", when: resolved||cs.status==="ongoing" ? "&#10003;" : "&mdash;", done: resolved||cs.status==="ongoing" },
		{ label: ruled ? "Adjudicator ruled" : cs.defaulted ? "Default judgment &mdash; flag fell" : resolved ? "Advocates settled" : "Open", when: resolved ? cs.resolved : "&mdash;", done: resolved }
	].map(x => `<div class="tl-item"><span class="tl-dot" style="background:${x.done?c.bent:c.hair}"></span>${x.label}<span class="tl-when" style="color:${c.muted}">${x.when}</span></div>`).join("");
	const moneyInner = resolved ? (ruled ? `
		<div class="bench-row" style="margin-top:0">
			<div class="party"><div class="party-label" style="color:${c.bent}">${winner==="chal"?cs.chal:cs.def} &middot; WON</div><div class="st-val" style="color:${c.bent};font-size:18px;margin-top:3px">$0</div><div class="idmeta" style="color:${c.muted}">bond returned in full</div></div>
			<div class="party"><div class="party-label" style="color:${c.red}">${winner==="chal"?cs.def:cs.chal} &middot; LOST</div><div class="st-val" style="color:${c.red};font-size:18px;margin-top:3px">&minus;$11</div><div class="idmeta" style="color:${c.muted}">advocate $5 &middot; adjudicator $4 &middot; platform $2</div></div>
		</div>
		<div class="helper" style="color:${c.muted};margin-top:8px">Losing advocate forfeits their fee. No prize &mdash; the winner only breaks even.</div>` : cs.defaulted ? `
		<div class="bench-row" style="margin-top:0">
			<div class="party"><div class="party-label" style="color:${c.bent}">${winner==="chal"?cs.chal:cs.def} &middot; WON BY DEFAULT</div><div class="st-val" style="color:${c.bent};font-size:18px;margin-top:3px">$0</div><div class="idmeta" style="color:${c.muted}">their final offer enacted</div></div>
			<div class="party"><div class="party-label" style="color:${c.red}">${winner==="chal"?cs.def:cs.chal} &middot; WENT DARK</div><div class="st-val" style="color:${c.red};font-size:18px;margin-top:3px">&minus;$7</div><div class="idmeta" style="color:${c.muted}">abandonment is a loss &mdash; no adjudicator was ever paid</div></div>
		</div>
		<div class="helper" style="color:${c.muted};margin-top:8px">The clock fell. Honor is untouched &mdash; unless it was the advocate who flagged, which is a breach.</div>` : `
		<div class="bench-row" style="margin-top:0">
			<div class="party"><div class="party-label" style="color:${c.muted}">${cs.chal}</div><div class="st-val" style="color:${c.ink};font-size:18px;margin-top:3px">&minus;$6</div></div>
			<div class="party"><div class="party-label" style="color:${c.muted}">${cs.def}</div><div class="st-val" style="color:${c.ink};font-size:18px;margin-top:3px">&minus;$6</div></div>
		</div>
		<div class="helper" style="color:${c.muted};margin-top:8px">Advocates agreed &mdash; no adjudicator. Each pays their advocate $5 + half the $2 platform fee. Cheaper than a ruling; the default path.</div>`) : "";
	/* precedent rows quote holdings — the rulings — never the bends that occasioned them */
	const precRows = [
		...(cs.citing ? [[cs.citing, CASES[cs.citing]]] : []),
		...((cs.citedIn||[]).map(pc => [pc, CASES[pc]]))
	];
	const prec = precRows.map(([pc, pcs]) => `<div class="prec-item" style="border-color:${c.dotted}" data-action="go" data-screen="casedetail" data-case="${pc}">
			<span class="prec-code" style="color:${c.muted}">^${pc}</span>${pcs.holding
				? `<span class="prec-q" style="color:${c.ink};font-style:normal">${rubric(c, pcs.holding)}</span>`
				: `<span class="prec-q" style="color:${c.muted};font-family:Helvetica,sans-serif;font-size:10.5px;font-style:normal">no ruling yet &mdash; still in deliberation</span>`}
		</div>`).join("");
	const attemptInner = `<div class="attempt-quote" style="border-color:${c.accent};color:${c.ink};margin-top:0">${cs.parent?rubric(c, cs.attempt):cs.attempt}</div>
		<div class="attempt-by" style="color:${c.muted}">&mdash; ${cs.parent?(CASES[cs.parent].adj?CASES[cs.parent].adj+", in ^"+cs.parent:"by default judgment in ^"+cs.parent):cs.def}</div>`;
	/* the case, top-down: conclusion (or what happens next), then the rule, then the comment that offended it */
	const ruleText = !cs.parent && cs.ruleNum && THREADS[cs.thread] ? THREADS[cs.thread].rules[cs.ruleNum-1] : null;
	const secLabel = (l) => `<div class="sec-label" style="color:${c.muted};margin-top:20px">${l}</div>`;
	const subjectBlock = cs.parent
		? `${secLabel("THE RULING UNDER APPEAL")}${attemptInner}`
		: `${!resolved && cs.claim && cs.status !== "demand" && cs.status !== "refused" ? `${secLabel("THE CLAIM")}
			<div class="attempt-quote" style="border-color:${c.hair};color:${c.ink};margin-top:0">${cs.claim}</div>
			<div class="attempt-by" style="color:${c.muted}">&mdash; ${cs.chal}, challenger</div>` : ""}
		${ruleText ? `${secLabel(cs.ruleReview ? "THE RULE UNDER REVIEW" : "THE RULE")}
			<div class="rule-cited" style="border-color:${c.accent};color:${c.ink};background:${c.box};margin-top:8px"><span class="num" style="color:${c.accent}">${cs.ruleNum}</span>${ruleText}</div>` : ""}
		${cs.ruleReview ? "" : `${secLabel("THE BEND")}${attemptInner}`}`;
	const advLine = (name, placeholder) => name
		? `<div class="party-brehon" style="color:${c.muted}">${brehonMark(c,name.split(" ").map(w=>w[0]).join(""))}${name}</div>`
		: `<div class="party-brehon" style="color:${c.muted};font-style:italic">${placeholder}</div>`;
	const benchInner = `<div class="bench-row" style="margin-top:0">
			<div class="party"><div class="party-label" style="color:${c.muted}">CHALLENGER</div><div class="party-name" style="color:${c.ink}">${cs.chal}</div>
				<div class="party-label" style="color:${c.muted};margin-top:7px;font-weight:400">advocate</div>${advLine(cs.chalBrehon, "TBD")}</div>
			<div class="party"><div class="party-label" style="color:${c.muted}">DEFENDER</div><div class="party-name" style="color:${c.ink}">${cs.def}</div>
				<div class="party-label" style="color:${c.muted};margin-top:7px;font-weight:400">advocate</div>${advLine(cs.defBrehon, cs.status==="pending" ? "not yet contested" : "TBD")}
				${cs.backer?`<div class="party-label" style="color:${c.muted};margin-top:7px;font-weight:400">bond backed by</div><div class="party-brehon" style="color:${c.muted}">${cs.backer}</div>`:""}</div>
		</div>
		${cs.adj?`<div style="margin-top:14px;padding-top:12px;border-top:1px dotted ${c.dotted}">
			<div class="party-label" style="color:${c.muted}">ADJUDICATOR &middot; ON DEADLOCK</div>
			<div class="party-brehon" style="color:${c.ink};margin-top:6px">${brehonMark(c,cs.adj.split(" ").map(w=>w[0]).join(""))}${cs.adj}</div>
			<div class="idmeta" style="color:${c.muted};margin-top:4px">Independent of both advocates. Chose the ${winner==="chal"?"challenger":"defender"}'s final offer.</div></div>`:""}`;
	const timelineInner = `<div class="tl" style="border-color:${c.dotted};color:${c.ink};margin-top:0">${timeline}</div>`;
	const tab = params.tab || "ruling";
	const seg = (id, label) => `<span data-action="setCaseTab" data-tab="${id}" style="padding-bottom:11px;font-family:Helvetica,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;cursor:pointer;color:${tab===id?c.ink:c.muted};border-bottom:2px solid ${tab===id?c.accent:"transparent"};margin-bottom:-1px">${label}</span>`;
	const citeLine = `<div class="cite-line" style="color:${copied[code]?c.bent:c.muted};margin-top:18px" data-action="copyCite" data-case="${code}">brehon.com/${code}&nbsp;&nbsp;<span style="font-family:Helvetica,sans-serif;font-weight:800;letter-spacing:.06em;color:${copied[code]?c.bent:c.accent}">${copied[code]?"&#10003; COPIED":"COPY"}</span></div>`;
	const loserName = winner === "def" ? cs.chal : cs.def;
	const appealBlock = !(ruled || cs.defaulted) ? "" :
		cs.appealedBy ? `<div class="cite-box" style="border-color:${c.amber};margin-top:18px" data-action="go" data-screen="casedetail" data-case="${cs.appealedBy}">
			<div class="cite-row"><span style="color:${c.amber};font-family:Helvetica,sans-serif;font-size:11px;font-weight:800;letter-spacing:.1em">UNDER APPEAL</span><span class="cite-copy" style="color:${c.accent}">^${cs.appealedBy} &rsaquo;</span></div>
		</div>` :
		loserName === "Harry Potter" ? `<div style="margin-top:18px">
			<div class="band-cta" style="background:${c.accent};color:${c.accentInk}" data-action="startAppeal" data-case="${code}">APPEAL &middot; POST $40</div>
			<div class="band-cta" style="border:1px solid ${c.hair};color:${c.muted};margin-left:10px" data-action="go" data-screen="casedetail" data-case="${code}" data-tab="history">ACCEPT IT</div>
		</div>` : "";
	const rulingTab = resolved ? `
		<div style="margin-top:22px">
			<div style="display:flex;align-items:baseline;gap:11px;flex-wrap:wrap">
				<span style="font-family:Helvetica,sans-serif;font-size:20px;font-weight:800;letter-spacing:.06em;color:${vc}">${cs.verdict}</span>
				<span style="font-family:Helvetica,sans-serif;font-size:9px;font-weight:800;letter-spacing:.14em;color:${c.muted};border:1px solid ${c.hair};padding:2px 7px">${state}</span>
				${ruled||cs.defaulted?`<span data-action="openModal" data-type="seal" data-case="${code}" style="font-family:Helvetica,sans-serif;font-size:9px;font-weight:800;letter-spacing:.14em;color:${c.bent};border:1px solid ${c.bent};padding:2px 7px;cursor:pointer">SEALED &#10003; &middot; VERIFY</span>`:""}
			</div>
			<div class="holding" style="margin-top:13px;color:${c.ink}">${rubric(c, cs.holding)}</div>
		</div>
		${subjectBlock}
		${appealBlock}
		${citeLine}
		${prec ? `<div class="prec" style="border-color:${c.hair};margin-top:18px"><div class="sec-label" style="color:${c.muted}">PRECEDENT &middot; ${precRows.length} ${precRows.length===1?"case":"cases"}</div>${prec}</div>` : ""}`
	: (() => {
		const fa = findAttempt(code);
		const ctaPair = (a1, l1, a2, l2) => `<div style="margin-top:12px">${a1?`<div class="band-cta" style="background:${c.accent};color:${c.accentInk}" ${a1}>${l1}</div>`:""}${a2?`<div class="band-cta" style="border:1px solid ${c.hair};color:${c.muted};margin-left:10px" ${a2}>${l2}</div>`:""}</div>`;
		if (cs.status === "demand" && cs.cureProposed) return `
			<div class="band" style="border-color:${c.bent};background:${c.box};margin-top:22px">
				<div class="band-row1"><span class="band-word" style="color:${c.bent}">CURE OFFERED</span></div>
				<div class="band-sub serif" style="color:${c.ink}">${fa && fa.a.cure ? fa.a.cure : "The bend, edited to comply."}</div>
				<div class="band-sub" style="color:${c.muted}">${cs.def} edited the bend. Confirm and this closes at $0.</div>
				${ctaPair(`data-action="confirmCure" data-case="${code}"`, "CONFIRM THE CURE &middot; $0", `data-action="refuseCase" data-case="${code}"`, "NOT ENOUGH &mdash; REFUSE")}
			</div>${subjectBlock}`;
		if (cs.status === "demand") return `
			<div class="band" style="border-color:${c.amber};background:${c.box};margin-top:22px">
				<div class="band-row1"><span class="band-word" style="color:${c.amber}">DEMAND OPEN</span>
					<span class="band-time" style="color:${c.muted}">${cs.demandClock||"48h"} to reply &middot; $0 staked</span></div>
				<div class="band-sub serif" style="color:${c.ink}">${cs.claim||""}</div>
				<div class="band-sub" style="color:${c.muted}">&mdash; ${cs.chal}'s demand. ${cs.def} replies:</div>
				${ctaPair(`data-action="cureCase" data-case="${code}"`, "CURE &mdash; EDIT TO COMPLY", `data-action="concedeCase" data-case="${code}"`, "CONCEDE &mdash; TAKE IT DOWN")}
				${ctaPair(`data-action="refuseCase" data-case="${code}"`, "REFUSE", null, null)}
				<div style="margin-top:10px;font-family:Helvetica,sans-serif;font-size:10.5px;color:${c.muted};cursor:pointer" data-action="refuseCase" data-case="${code}" data-noreply="1">or let the clock fall &mdash; recorded as &ldquo;no reply,&rdquo; same as refusal</div>
			</div>${subjectBlock}`;
		if (cs.status === "refused") return `
			<div class="band" style="border-color:${c.accent};background:${c.box};margin-top:22px">
				<div class="band-row1"><span class="band-word" style="color:${c.red}">DEMAND REFUSED</span>
					<span class="band-time" style="color:${c.muted}">${cs.noReply?"no reply &mdash; clock fell":"refused outright"}</span></div>
				<div class="band-sub" style="color:${c.muted}">The free rungs are spent. Escalation is open: retain an advocate and post a $20 bond &mdash; or walk away at $0.</div>
				${fa?ctaPair(`data-action="go" data-screen="challenge" data-thread="${fa.thread}" data-attemptidx="${fa.idx}" data-step="brehon"`, "ESCALATE &middot; ADVOCATE + $20 BOND", null, null):""}
			</div>${subjectBlock}`;
		if (cs.status === "cured" || cs.status === "conceded") return `
			<div style="margin-top:22px">
				<div style="display:flex;align-items:baseline;gap:11px">
					<span style="font-family:Helvetica,sans-serif;font-size:20px;font-weight:800;letter-spacing:.06em;color:${cs.status==="cured"?c.bent:c.muted}">${state}</span>
					<span style="font-family:'SF Mono',Menlo,monospace;font-size:11px;color:${c.bent}">$0 &middot; no fees</span>
				</div>
				<div class="holding" style="margin-top:13px;color:${c.ink};font-size:16px">${cs.status==="cured"
					? (fa && fa.a.cure ? "Edited to comply, confirmed by the challenger: &ldquo;"+(fa.a.cure)+"&rdquo;" : "Edited to comply, confirmed by the challenger.")
					: "Taken down by its author before any bond was posted."}</div>
				<div class="helper" style="color:${c.muted};margin-top:10px">Resolved at the parley rung. No bonds, no fees, no honor event.</div>
			</div>
			${subjectBlock}
			${citeLine}`;
		return `
		<div class="band" style="border-color:${c.hair};background:${c.box};margin-top:22px">
			<div class="band-row1"><span class="band-word" style="color:${cs.status==="undefended"?c.muted:c.amber}">${state}</span>
				<span class="band-time" style="color:${c.muted}">${cs.status==="undefended"?"":cs.daysLeft?cs.daysLeft+" days left":cs.daysToFind?cs.daysToFind+" days to be accepted":""}</span></div>
			<div class="band-sub" style="color:${c.muted}">${cs.status==="undefended"?"Nobody contested. The bend is soft-hidden; "+cs.chal+"'s bond returned in full. No fees.":cs.status==="pending"?(cs.parent?"$40 staked. "+cs.def+" has 5 days to contest with a matching $40 &mdash; or the ruling is vacated and reheard, never auto-reversed.":"Bond staked, awaiting "+(youDefend?"you":"a defender")+" to contest with a matching bond."):"Both advocates in. Trying to settle before it goes to an adjudicator."}</div>
			${youDefend?`<div class="band-cta" style="background:${c.accent};color:${c.accentInk};margin-top:12px" data-action="startContest" data-case="${code}">CONTEST &middot; POST $20</div>
			<div class="band-cta" style="border:1px solid ${c.hair};color:${c.muted};margin-top:12px;margin-left:10px" data-action="lapseCase" data-case="${code}">LET IT LAPSE</div>`:""}
		</div>
		${subjectBlock}
		${cs.status==="undefended"||cs.status==="pending"?"":`<div class="cite-box" style="border-color:${c.hair};margin-top:16px" data-action="go" data-screen="transcript" data-case="${code}">
			<div class="cite-row" style="color:${c.muted}"><span>Follow the deliberation</span><span class="cite-copy" style="color:${c.accent}">OPEN &rsaquo;</span></div>
		</div>`}`;
	})();
	const histSec = (label, inner) => `<div class="sec-label" style="color:${c.muted};margin-top:20px;padding-top:16px;border-top:1px solid ${c.hair}">${label}</div>${inner}`;
	const historyTab = `<div style="margin-top:6px">
		<div class="sec-label" style="color:${c.muted};margin-top:18px">PARTIES &amp; ADVOCATES</div>${benchInner}
		${resolved ? histSec("THE OUTCOME", moneyInner) : ""}
		${histSec("RECEIPTS", receiptLines(cs).map(([l, who]) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dotted ${c.dotted};font-family:'SF Mono',Menlo,monospace;font-size:11px"><span style="color:${c.ink}">${l}</span><span style="color:${c.muted};text-align:right">${who}</span></div>`).join(""))}
		${histSec("TIMELINE", timelineInner)}
		<div class="cite-box" style="border-color:${c.hair};margin-top:18px" data-action="go" data-screen="transcript" data-case="${code}">
			<div class="cite-row" style="color:${c.muted}"><span>Full transcript</span><span class="cite-copy" style="color:${c.accent}">READ &rsaquo;</span></div>
		</div>

	return `<div class="screen" style="background:${c.bg};color:${c.ink}">

				: cs.ruleReview
				? `Rule-validity review &middot; ${cs.ruleReview} &middot; Rule ${cs.ruleNum} of &ldquo;${THREADS[cs.thread]?THREADS[cs.thread].title:"a thread"}&rdquo;`

/* ============ TRANSCRIPT ============ */
screens.transcript = function(params) {
	const c = t();
	const code = params.case || "AB12CD";
	const cs = CASES[code];
	const resolved = cs.status === "resolved";
	const ruled = resolved && !!cs.adj;
	const vc = resolved ? verdictColor(c, cs.verdict) : c.amber;
	const advA = cs.chalBrehon || "Challenger's advocate";
	const advB = cs.defBrehon || "Defender's advocate";
	const keepBroke = cs.verdict === "BENT";
	const dOut = DELIB_OUTCOMES[code];
	const chalKind = (dOut && dOut.offers.chal) || "REMOVE";
	const defKind = (dOut && dOut.offers.def) || "KEEP";
	const offerLine = (side, kind) => kind === "EDIT"
		? `For the ${side} &mdash; ${dOut.editPatch} Final offer: an edit.`
		: kind === "REMOVE"
		? `For the ${side} &mdash; read as written, this breaks Rule ${cs.ruleNum}. Final offer: remove it.`
		: `For the ${side} &mdash; <span class="cite-chip" style="border-color:${c.hair};color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${cs.citing||code}">^${cs.citing||code}</span> holds; form over intent. Final offer: keep it.`;
	const entries = [
		{ day:"DAY 1", sig:cs.chal, when:"9:02 AM", body: cs.parent
			? `Filed an appeal of <span class="cite-chip" style="border-color:${c.hair};color:${c.accent}" data-action="go" data-screen="casedetail" data-case="${cs.parent}">^${cs.parent}</span> ${cs.appealKind==="cause"?"for cause":"on the merits"} and posted the doubled bond.`
			: `Filed a challenge on Rule ${cs.ruleNum} and posted bond.` },
		{ day:null, sig:cs.def, when:"11:40 AM", body:cs.attempt },
		{ day:"DAY 2", sig:advA, when:"3:15 PM", offer:chalKind, body:offerLine("challenger", chalKind) },
		{ day:null, sig:advB, when:"4:02 PM", offer:defKind, body:offerLine("defender", defKind) },
		...(extraEntries[code] || [])
	];
	const body = entries.map(e => `
		${e.day?`<div class="daysep" style="color:${c.muted}">${e.day}</div>`:""}
		<div class="entry">
			<div class="ehead" style="color:${c.muted}"><span class="esig" style="color:${c.ink}">${e.sig}</span>${e.offer?`<span class="cite-chip" style="border-color:${c.hair};color:${c.muted}">FINAL: ${e.offer}</span>`:""}<span>${e.when}</span></div>
			<div class="ebody" style="color:${c.ink}">${e.body}</div>
		</div>`).join("");
	const proposal = resolved ? `<div class="proposal" style="border-color:${vc};background:${c.box}">
			<div class="plabel" style="color:${c.muted};display:flex;justify-content:space-between;align-items:baseline"><span>${ruled?cs.adj.toUpperCase()+" &middot; ADJUDICATOR":cs.defaulted?"DEFAULT JUDGMENT &middot; FLAG FELL":"ADVOCATES SETTLED"}</span>${ruled||cs.defaulted?`<span data-action="openModal" data-type="seal" data-case="${code}" style="color:${c.bent};font-weight:800;letter-spacing:.1em;cursor:pointer">SEALED &#10003; &middot; VERIFY</span>`:""}</div>
			<div class="pverdict" style="color:${vc}">${cs.verdict}</div>
			<div class="pnote" style="color:${c.ink}">${rubric(c, cs.holding)}</div>
			<div class="pactions"><span style="color:${c.muted};font-weight:700">${ruled?"Chose the "+(keepBroke?"defender":"challenger")+"'s final offer &mdash; "+(keepBroke?"keep":"remove")+".":cs.defaulted?"Abandonment is a loss. The other side's final offer is enacted; no adjudicator needed.":"Both advocates agreed. No adjudicator needed."}</span></div>
		</div>
		<div class="lockline" style="color:${c.muted}">&mdash; record locked ${cs.resolved} &mdash;</div>` :
		(cs.status === "ongoing" && DELIB_OUTCOMES[code] ? (() => {
			const o = DELIB_OUTCOMES[code];
			const mine = o.you === "chal" ? o.offers.chal : o.offers.def;
			const theirs = o.you === "chal" ? o.offers.def : o.offers.chal;
			const myAdv = o.you === "chal" ? cs.chalBrehon : cs.defBrehon;
			const theirAdv = o.you === "chal" ? cs.defBrehon : cs.chalBrehon;
			const offerCell = (label, adv, kind, clock) => `<div style="flex:1">
				<div style="color:${c.muted};font-size:9.5px;letter-spacing:.1em;font-weight:800">${adv} &middot; ${label}</div>
				<div style="color:${c.ink};font-weight:800;margin-top:4px">FINAL: ${kind}</div>
				${kind==="EDIT"&&o.editPatch?`<div style="font-family:Palatino,Georgia,serif;font-style:italic;font-weight:400;color:${c.muted};margin-top:4px;line-height:1.4">${o.editPatch}</div>`:""}
				<div style="font-family:'SF Mono',Menlo,monospace;color:${c.muted};font-size:10px;margin-top:5px">&#9201; ${clock} on the clock</div>
			</div>`;
			return `<div class="proposal" style="border-color:${c.amber};background:${c.box}">
				<div class="plabel" style="color:${c.muted}">DELIBERATION &middot; YOUR MOVE</div>
				<div style="display:flex;gap:10px;margin-top:10px;font-family:Helvetica,sans-serif;font-size:11px">
					${offerCell("YOURS", myAdv, mine, o.clocks.mine)}
					${offerCell("THEIRS", theirAdv, theirs, o.clocks.theirs)}
				</div>
				<div class="pactions" style="margin-top:14px;flex-direction:column;align-items:stretch;gap:9px">
					<div class="submit-btn" style="background:${c.accent};color:${c.accentInk};margin:0" data-action="acceptOffer" data-case="${code}">ACCEPT THEIRS &middot; SETTLE <span style="font-family:'SF Mono',Menlo,monospace">&minus;$6</span></div>
					<div class="submit-btn" style="border:1.5px solid ${c.hair};color:${c.ink};margin:0" data-action="declareDeadlock" data-case="${code}">HOLD FIRM &middot; DEADLOCK <span style="font-family:'SF Mono',Menlo,monospace;color:${c.muted}">$0 or &minus;$11</span></div>
					<div style="text-align:center;font-family:Helvetica,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:${c.muted};cursor:pointer;padding:4px" data-action="abandonCase" data-case="${code}">or go dark &mdash; when your clock falls, their offer is enacted <span style="font-family:'SF Mono',Menlo,monospace">&minus;$11</span></div>
				</div>
			</div>`;
		})() :
		(cs.clocksPaused ? `<div class="proposal" style="border-color:${c.hair};background:${c.box}">
			<div class="plabel" style="color:${c.muted};display:flex;justify-content:space-between"><span>DELIBERATION</span><span style="color:${c.amber};font-weight:800;letter-spacing:.1em">CLOCKS PAUSED &mdash; SYSTEM FAULT</span></div>
			<div style="display:flex;gap:18px;margin-top:10px;font-family:'SF Mono',Menlo,monospace;font-size:11px;color:${c.hair}"><span style="color:${c.muted};opacity:.5">&#9201; ${cs.chalBrehon} &middot; paused</span><span style="color:${c.muted};opacity:.5">&#9201; ${cs.defBrehon} &middot; paused</span></div>
			<div class="pnote" style="color:${c.muted};font-style:normal;font-family:Helvetica,sans-serif;font-size:11px">Clocks paused 41m &mdash; platform fault &middot; time charged to no one.</div>
		</div>` :
		`<div class="lockline" style="color:${c.muted}">&mdash; advocates deliberating &middot; settle, or it goes to an adjudicator &mdash;</div>`));
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		${stackHead("TRANSCRIPT " + code)}
		<div class="record">${body}${proposal}</div>
		${resolved ? "" : `<div class="inputbar" style="border-color:${c.hair}"><div class="input-fake" style="border-color:${c.hair};color:${c.muted}" data-action="addEntry" data-case="${code}">Add to the record&hellip;</div></div>`}
	</div>`;
};
