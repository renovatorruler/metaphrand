/* ============ BECOME A BREHON ============ */
const BREHON_APP_DISPUTES = ["VN18RY", "UF82MB"];
const BREHON_RATIONALE_FILL = {
	VN18RY: "Read as written, 'flipping' is an ordinary word doing ordinary work. I can suspect what it stands in for, but a rule against profanity punishes the word on the page, not the word in the mind. On its face, this holds — BENT.",
	UF82MB: "The rule asks you to open with agreement, and he does: the first clause is agreement in plain words. Arguing the opposite afterward is the debate the thread invited, not a breach of the ritual that opens it. The form is met — BENT."
};
function disputeCard(code) {
	const c = t();
	const cs = CASES[code];
	const th = THREADS[cs.thread];
	const picked = brehonPicks[code];
	const rat = filled["rationale-"+code];
	const choice = (word, color) => `<div class="choice" data-action="pickDispute" data-case="${code}" data-choice="${word}"
			style="border-color:${color};color:${color};background:${picked===word?c.box:"transparent"};border-width:${picked===word?"2.5px":"1.5px"}">
			<div class="choice-word">${word}${picked===word?" &#10003;":""}</div>
		</div>`;
	return `
		<div class="ghead" style="color:${c.muted}"><span>^${code} &middot; Rule ${cs.ruleNum} of &ldquo;${th.title}&rdquo;</span></div>
		<div class="rule-cited" style="border-color:${c.accent};color:${c.ink};background:${c.box};margin-top:8px">
			<span class="num" style="color:${c.accent}">${cs.ruleNum}</span>${th.rules[cs.ruleNum - 1]}</div>
		<div class="attempt-quote" style="border-color:${c.hair};color:${c.ink};margin-top:10px">${cs.attempt}</div>
		<div class="attempt-by" style="color:${c.muted}">&mdash; ${cs.def}, challenged by ${cs.chal}</div>
		<div class="sec-label" style="color:${c.muted};margin-top:20px">YOUR DECISION</div>
		<div class="choice-row" style="margin-top:8px">${choice("BENT", c.bent)}${choice("BROKEN", c.red)}</div>
		<div class="sec-label" style="color:${c.muted};margin-top:20px">YOUR RATIONALE</div>
		<div class="helper" style="color:${c.muted}">A holding a stranger could cite. Say how you read the rule and why your call follows.</div>
		<div class="textarea" style="border-color:${c.hair};color:${rat?c.ink:c.muted};min-height:100px" data-action="fillField" data-field="rationale-${code}">${rat?BREHON_RATIONALE_FILL[code]:"Write your reasoning&hellip;"}</div>
		<div class="charcount" style="color:${c.muted}">${rat?BREHON_RATIONALE_FILL[code].length:0} / 400</div>`;
}
screens.becomebrehon = function(params) {
	const c = t();
	const N = BREHON_APP_DISPUTES.length;
	const step = params.step || "intro";
	let body, cta, headMid, dots = "";
	if (step === "intro") {
		headMid = "BUILD YOUR STANDING";
		body = `<div class="hero"><div class="hero-text">
				<div class="hero-title">You're already a brehon.</div>
				<div class="hero-sub" style="color:${c.muted}">Everyone here can be chosen to rule &mdash; there is no separate class of judges. What you don't have yet is a record.</div>
			</div>${ringedSiglum(c,"SS",64,true)}</div>
			<div class="duties" style="border-color:${c.hair}">
				<div class="sec-label" style="color:${c.muted}">WHAT A BREHON DOES</div>
				<div style="margin-top:10px;font-family:Helvetica,sans-serif;font-size:12.5px;line-height:2;color:${c.ink}">
					<span class="num" style="color:${c.accent}">1</span>Read the rules as written, not as intended.<br>
					<span class="num" style="color:${c.accent}">2</span>Write a holding a stranger could cite later.<br>
					<span class="num" style="color:${c.accent}">3</span>Rule within 48 hours or recuse.</div>
			</div>
			<div class="earn" style="border-color:${c.amber};background:${c.box};color:${c.ink}">No one approves you and there is no higher court to overturn you. Rule ${N} open cases in public; parties read your reasoning and choose you &mdash; or don't. That is the only ladder there is.</div>
			<div class="helper" style="color:${c.muted};margin-top:10px">Brehons earn <span style="font-family:'SF Mono',Menlo,monospace">$5</span> per case as advocates, <span style="font-family:'SF Mono',Menlo,monospace">$4</span> as adjudicators.</div>`;
		cta = `<div class="submit-btn" style="background:${c.accent};color:${c.accentInk}" data-action="go" data-screen="becomebrehon" data-step="d0">RULE ${N} CASES IN PUBLIC &rsaquo;</div>`;
	} else {
		const i = parseInt(step.slice(1), 10);
		const code = BREHON_APP_DISPUTES[i];
		const last = i === N - 1;
		const ready = brehonPicks[code] && filled["rationale-"+code];
		headMid = "DISPUTE " + (i+1) + " OF " + N;
		dots = `<div style="padding:12px 24px 0"><div class="progress">${[...Array(N)].map((_,k)=>`<div class="pdot" style="background:${k<=i?c.accent:c.hair}"></div>`).join("")}</div></div>`;
		body = `<div class="helper" style="color:${c.muted}">No reveal &mdash; this case is genuinely open. Read it, rule, and say why.</div>${disputeCard(code)}`;
		const attrs = ready ? (last ? `data-action="go" data-screen="becomebrehonpending"` : `data-action="go" data-screen="becomebrehon" data-step="d${i+1}"`) : "";
		cta = `${ready?"":`<div class="helper" style="color:${c.muted};text-align:center">A decision and a rationale are both required</div>`}

	}
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">

};

screens.onboarding = function(params) {
	const c = t();
	const step = params.step || "game";
	const idx = step === "game" ? 0 : step === "mark" ? 1 : 2;
	const dots = [0,1,2].map(i => `<div class="pdot" style="background:${i<=idx?c.accent:c.hair}"></div>`).join("");
	const top = (kicker) => `<div class="spec-top"><div class="spec-kicker" style="color:${c.accent}">${kicker}</div><div class="progress">${dots}</div></div>
		<div style="position:absolute;top:0;right:0;z-index:6;padding:16px 20px;font-family:Helvetica,sans-serif;font-size:10px;font-weight:800;letter-spacing:.12em;color:${c.muted};cursor:pointer" data-action="finishOnboarding">SKIP</div>`;
	const backBtn = `<div class="cta-primary" style="border:1.5px solid ${c.hair};color:${c.muted};flex:0 0 32%" data-action="back">&lsaquo; BACK</div>`;
	const cta = (label, action, on) => `<div style="display:flex;gap:10px;margin-top:26px">${backBtn}<div class="cta-primary" style="background:${on?c.accent:c.hair};color:${on?c.accentInk:c.muted};flex:1;${on?"":"pointer-events:none"}" ${action}>${label}</div></div>`;
	const bottomNav = (fwd) => `<div style="position:absolute;bottom:40px;left:30px;right:30px;display:flex;gap:10px">${backBtn}${fwd||""}</div>`;

	if (step === "game") {
		const th = THREADS.movies;
		const phase = params.phase || "intro";
		const gt = CASES.GT27NV, sb = CASES.SB63KH;
		const kick = (l) => `<div style="font-family:Helvetica,sans-serif;font-size:11px;font-weight:800;letter-spacing:.16em;color:${c.muted}">${l}</div>`;
		const card = (inner, tapPhase, fwd) => `<div class="screen" style="background:${c.bg};color:${c.ink};position:relative" ${tapPhase?`data-action="go" data-screen="onboarding" data-step="game" data-phase="${tapPhase}"`:""}>
			${top("THE GAME")}
			<div style="position:absolute;inset:0 0 110px 0;display:flex;flex-direction:column;justify-content:center;padding:0 30px;gap:18px">${inner}</div>
			${bottomNav(tapPhase?`<div class="cta-primary" style="background:${c.accent};color:${c.accentInk};flex:1" data-action="go" data-screen="onboarding" data-step="game" data-phase="${tapPhase}">NEXT &rsaquo;</div>`:(fwd||""))}
		</div>`;
		if (phase === "intro") return card(`
			<div>
				<div style="font-family:Helvetica,sans-serif;font-size:26px;font-weight:800;line-height:1.25">People post rules.</div>
				<div style="font-family:Helvetica,sans-serif;font-size:12px;color:${c.muted};margin-top:6px">games built to be gamed</div>
			</div>
			<div>
				<div style="font-family:Helvetica,sans-serif;font-size:26px;font-weight:800;line-height:1.25">People try to outsmart them.</div>
				<div style="font-family:Helvetica,sans-serif;font-size:12px;color:${c.muted};margin-top:6px">some bend, some break</div>
			</div>
			<div>
				<div style="font-family:Helvetica,sans-serif;font-size:26px;font-weight:800;line-height:1.25">You be the judge.</div>
				<div style="font-family:Helvetica,sans-serif;font-size:12px;color:${c.muted};margin-top:6px">call each try bent or broken</div>
			</div>`, "rule");
		if (phase === "rule") return card(`
			${kick("SOMEONE POSTS A GAME")}
			<div style="font-family:Palatino,Georgia,serif;font-size:27px;line-height:1.3">&ldquo;${th.title}&rdquo;</div>
			<div style="display:flex;gap:12px;align-items:baseline"><span class="num" style="color:${c.accent};font-size:13px">2</span><span style="font-family:Palatino,Georgia,serif;font-size:20px;color:${c.muted}">${th.rules[1]}</span></div>`, "attempt");
		if (phase === "attempt") return card(`
			${kick("SOMEONE TRIES THEIR LUCK")}
			<div style="font-family:Palatino,Georgia,serif;font-style:italic;font-size:23px;line-height:1.45">${gt.attempt}</div>
			<div style="display:flex;align-items:center;gap:9px;margin-top:4px">${icoBent(c.bent)}<span style="font-family:Helvetica,sans-serif;font-size:14px;font-weight:800;letter-spacing:.06em;color:${c.bent}">BENT</span><span style="font-family:Helvetica,sans-serif;font-size:11.5px;color:${c.muted}">sneaky, but legal &mdash; the post stands</span></div>`, "rate");
		if (phase === "rate") return card(`
			${kick("THEN SOMEONE POSTS THIS")}
			<div style="font-family:Palatino,Georgia,serif;font-style:italic;font-size:32px;line-height:1.3">${sb.attempt}</div>
			<div style="font-family:Helvetica,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;color:${c.muted};margin-top:10px">YOUR CALL &mdash; IS IT&hellip;</div>
			<div class="choice-row">
				<div class="choice" style="border-color:${c.bent};color:${c.bent}" data-action="go" data-screen="onboarding" data-step="game" data-phase="reveal" data-choice="BENT"><div class="choice-word">BENT</div><div class="choice-gloss" style="color:${c.muted}">clever, still legal</div></div>
				<div class="choice" style="border-color:${c.red};color:${c.red}" data-action="go" data-screen="onboarding" data-step="game" data-phase="reveal" data-choice="BROKEN"><div class="choice-word">BROKEN</div><div class="choice-gloss" style="color:${c.muted}">it crossed the line</div></div>
			</div>`);
		const line = (delay, dot, html) => `<div class="rise" style="animation-delay:${delay}s;display:flex;align-items:baseline;gap:14px;padding:9px 0">
			<span style="width:9px;height:9px;border-radius:50%;background:${dot};flex-shrink:0;transform:translateY(-1px)"></span>
			<span style="font-family:Helvetica,sans-serif;font-size:17px;line-height:1.45;color:${c.ink}">${html}</span></div>`;
		return card(`
			<div class="rise" style="animation-delay:.1s;font-family:Palatino,Georgia,serif;font-size:26px;line-height:1.3">${params.choice === "BROKEN" ? "So ruled the brehon." : "Interesting call &mdash; the brehon ruled the other way."}</div>
			<div class="rise" style="animation-delay:.9s;font-family:Helvetica,sans-serif;font-size:11px;font-weight:800;letter-spacing:.16em;color:${c.muted};margin-top:6px">A READER CHALLENGED IT</div>
			<div>
				${line(1.6, c.bent, `${sb.chal} demanded a fix.`)}
				${line(2.6, c.bent, `${sb.def} refused &mdash; both posted bonds.`)}
				${line(3.6, c.bent, `Advocates argued. Deadlock.`)}
				${line(4.6, c.red, `The adjudicator ruled <b style="color:${c.red};font-size:18px;letter-spacing:.04em">BROKEN</b>.`)}
			</div>
			<div class="rise" style="animation-delay:5.6s;font-family:Palatino,Georgia,serif;font-size:21px;line-height:1.4;margin-top:6px">${rubric(c, sb.holding)}</div>`,
			null,
			`<div class="cta-primary" style="background:${c.accent};color:${c.accentInk};flex:1" data-action="go" data-screen="onboarding" data-step="mark">CONTINUE</div>`);
	}

	if (step === "mark") {
		const named = filled.onbName;
		return `<div class="screen" style="background:${c.bg};color:${c.ink};position:relative">
			${top("YOUR MARK")}
			<div class="spec-folio">
				<div class="spec-prompt">The record cites you by name.</div>
				<div class="spec-sub" style="color:${c.muted}">Rulings, holdings, standing &mdash; all of it under your mark. Losing never lowers it.</div>
				<div style="display:flex;justify-content:center;margin:30px 0 22px">${ringedSiglum(c, named ? "HP" : "&middot;", 84, true)}</div>
				<div class="title-entry" data-action="fillField" data-field="onbName"><div class="placeholder" style="color:${named?c.ink:c.muted};text-align:center">${named ? "Harry Potter" : "Your name&hellip;"}</div></div>
				${cta("CONTINUE", `data-action="go" data-screen="onboarding" data-step="wand"`, named)}
			</div>
		</div>`;
	}

	if (step === "wand") {
		const v = voteState.onb;
		if (v === "bent") onbDidBent = true;
		if (v === "broken") onbDidBroken = true;
		const both = onbDidBent && onbDidBroken;
		const barColor = v === "bent" ? c.bent : v === "broken" ? c.red : c.muted;
		const say = v === "bent" ? `<span style="color:${c.bent};font-weight:800">BENT</span> &mdash; clever, still legal`
			: v === "broken" ? `<span style="color:${c.red};font-weight:800">BROKEN</span> &mdash; it crossed the line`
			: "&nbsp;";
		const prompt = both ? "That&rsquo;s your vote, on any attempt, anywhere."
			: !onbDidBent && !onbDidBroken ? "Tap the rod."
			: !onbDidBroken ? "Now press and hold it."
			: "Now tap it.";
		return `<div class="screen" style="background:${c.bg};color:${c.ink};position:relative">
			${top("THE SNAPWAND")}
			<div style="position:absolute;inset:0 0 110px 0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 30px;gap:26px;text-align:center">
				<div style="font-family:Helvetica,sans-serif;font-size:26px;font-weight:800;line-height:1.25">Your vote is a rod.</div>
				<span class="snapwand ${v?"v-"+v:""}" style="transform:scale(2.6);margin:34px 0" data-votekey="onb"><span class="wl" style="background:${barColor}"></span><span class="wr" style="background:${barColor}"></span></span>
				<div style="font-family:Helvetica,sans-serif;font-size:15px;color:${c.ink};min-height:22px">${say}</div>
				<div style="font-family:Helvetica,sans-serif;font-size:17px;font-weight:700;color:${both?c.bent:c.accent}">${prompt}</div>
				${both ? "" : `<div style="font-family:Helvetica,sans-serif;font-size:11px;color:${c.muted}">a tap calls it bent &middot; a hold snaps it broken</div>`}
			</div>
			<div style="position:absolute;bottom:40px;left:30px;right:30px">${cta("ENTER BREHON", `data-action="finishOnboarding"`, both).replace('margin-top:26px', 'margin-top:0')}</div>
		</div>`;
	}
	return "";
};

							<div class="choice-word">BENT</div><div class="choice-gloss" style="color:${c.muted}">clever, still legal</div></div>
						<div class="choice" style="border-color:${c.red};color:${c.red}" data-action="go" data-screen="spectator" data-step="${step}" data-phase="reveal" data-choice="BROKEN">
							<div class="choice-word">BROKEN</div><div class="choice-gloss" style="color:${c.muted}">it crossed the line</div></div>
					</div>
				</div>
			</div>
		</div>`;
	}
	const match = params.choice === sc.verdict;
	if (specScore[step] === undefined) specScore[step] = match;
	const vc = verdictColor(c, sc.verdict);
	const reasons = sc.reasons.map(([ini,body]) => `<div class="reason" style="border-color:${c.dotted};color:${c.ink}"><span class="who" style="color:${c.accent}">${ini}</span>${body}</div>`).join("");
	const last = step === 2;
	return `<div class="screen" style="background:${c.bg};color:${c.ink}">
		<div class="spec-top"><div class="spec-kicker" style="color:${c.accent}">THE RULING &middot; ${step+1} OF 3</div><div class="progress">${dots}</div></div>
		<div class="spec-folio">
			<div class="reveal-verdict">
				<div class="rv-yours" style="color:${c.muted}">YOU SAID ${params.choice} &middot; THE ADJUDICATOR CHOSE</div>
				<div class="rv-word" style="color:${vc}">${sc.verdict}</div>
				<div class="rv-match" style="background:${c.box};color:${match?c.bent:c.amber}">${match?"Right on the nose":"Not quite &mdash; they chose the other side's offer"}</div>
			</div>
			<div class="holding-box" style="border-color:${vc}">
				<div class="holding-label" style="color:${c.muted}">THE HOLDING</div>
				<div class="holding" style="font-size:15px;margin-top:7px;color:${c.ink}">${rubric(c, sc.holding)}</div>
			</div>
			<div class="spec-rules-label" style="color:${c.muted};margin-top:16px">FROM THE WRITTEN REASONS</div><div class="reasons">${reasons}</div>
		</div>
		<div class="spec-cta">
			<div style="display:flex;gap:10px">
				<div class="cta-primary" style="border:1.5px solid ${c.hair};color:${c.muted};flex:0 0 32%" data-action="back">&lsaquo; BACK</div>
				${last ? `<div class="cta-primary" style="background:${c.accent};color:${c.accentInk};flex:1" data-action="go" data-screen="signin">SIGN UP TO JUDGE FOR REAL &rsaquo;</div>`
					: `<div class="cta-primary" style="background:${c.accent};color:${c.accentInk};flex:1" data-action="go" data-screen="spectator" data-step="${step+1}" data-phase="guess">NEXT CASE &rsaquo;</div>`}
			</div>
			<div class="cta-sub" style="color:${c.muted}">${last?"You're ready.":(2-step)+" more, then Brehon is yours to join."}</div>
		</div>
	</div>`;
};

/* ============ RESOLVER / SHARE CARD ============ */
function resolverCard(params) {
	const c = t();
	const code = (params && params.case) || "AB12CD";
	const cs = CASES[code];
	const resolved = cs.status === "resolved";
	const vc = resolved ? verdictColor(c, cs.verdict) : c.amber;
	return `<div class="rcard" style="background:${c.bg};border-color:${c.hair}">
		<div class="rcard-inner">
			<div class="rcard-top">
				<div class="rcard-brand" style="color:${c.accent}">${ringedSiglum(c,"^",22,false)} BREHON</div>
				<div class="rcard-code" style="color:${c.muted}">^${code}</div>
			</div>
			<div class="rcard-holding" style="color:${c.ink}">${resolved?rubric(c, cs.holding):"Ruling pending &mdash; the brehons are still reading."}</div>
			<div class="rcard-verdict">
				<span class="rcv-word" style="color:${vc}">${resolved?cs.verdict:cs.status.toUpperCase()}</span>
				<span class="rcv-meta" style="color:${c.muted}">${cs.chal} v. ${cs.def} &middot; Rule ${cs.ruleNum}</span>
				${resolved&&(cs.adj||cs.defaulted)?`<span data-action="openModal" data-type="seal" data-case="${code}" style="font-family:Helvetica,sans-serif;font-size:9px;font-weight:800;letter-spacing:.12em;color:${c.bent};border:1px solid ${c.bent};padding:2px 6px;cursor:pointer">SEALED &#10003;</span>`:""}
			</div>
			<div class="rcard-attempt" style="border-color:${vc};color:${c.ink}">${cs.attempt}</div>
			<div class="rcard-foot" style="border-color:${c.hair}">
				<div class="rcard-parties" style="color:${c.muted}">Challenger &middot; ${cs.chal}<br>Defender &middot; ${cs.def}</div>
				<div class="rcard-url" style="color:${c.accent}">brehon.com/${code}</div>
			</div>
		</div>
		<div class="rcard-actions" style="color:${c.ink}">
			<span class="rcard-btn" style="color:${c.muted}" data-action="closeModal">CLOSE</span>
			<span class="rcard-btn" style="color:${c.accent}" data-action="closeModal">COPY LINK</span>
		</div>
	</div>`;
}

/* ============ RENDER ============ */
function renderAll() {
	const c = t();
	const fn = screens[current.screen] || screens.explore;
	document.getElementById("phone").innerHTML = fn(current.params);
	document.getElementById("phone").style.background = c.bg;
	document.body.style.background = c.bg;
	renderModal();
}
function sealSheet(params) {
	const c = t();
	const code = (params && params.case) || "AB12CD";
	return `<div class="rcard" style="background:${c.bg};border-color:${c.hair}">
		<div class="rcard-inner">
			<div class="rcard-brand" style="color:${c.bent}">SEALED &#10003;</div>
			<div class="rcard-holding" style="color:${c.ink};font-size:16px">This ruling is signed by the adjudicator and entered in a public record. Anyone can verify it &mdash; no trust in Brehon required.</div>
			<div class="rcard-foot" style="border-color:${c.hair}">
				<div class="rcard-parties" style="color:${c.muted}">Signature &middot; the adjudicator's<br>Record &middot; public, permanent</div>
				<div class="rcard-url" style="color:${c.accent}" data-action="copyCite" data-case="${code}">brehon.com/${code}${copied[code]?" &#10003;":""}</div>
			</div>
		</div>
		<div class="rcard-actions" style="color:${c.ink}">
			<span class="rcard-btn" style="color:${c.muted}" data-action="closeModal">CLOSE</span>
			<span class="rcard-btn" style="color:${c.accent}" data-action="copyCite" data-case="${code}">${copied[code]?"&#10003; COPIED":"COPY LINK"}</span>
		</div>
	</div>`;
}
function moneySheet(params) {
	const c = t();
	const kind = (params && params.kind) || "add";
	return `<div class="rcard" style="background:${c.bg};border-color:${c.hair}">
		<div class="rcard-inner">
			<div class="rcard-brand" style="color:${c.accent}">${kind==="add"?"ADD MONEY":"WITHDRAW"}</div>
			<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px">
				<span style="font-family:Helvetica,sans-serif;font-size:10px;font-weight:800;letter-spacing:.12em;color:${c.muted}">BALANCE</span>
				<span style="font-family:'SF Mono',Menlo,monospace;font-size:16px;font-weight:700;color:${c.ink}">${money(balance)}</span>
			</div>
			<div style="margin-top:8px">${kind==="add"?doorRows():DOORS.map(([tag,name])=>`<div class="disc-row" style="border-color:${t().hair}" data-action="withdrawAll">
				<span class="disc-label" style="color:${t().ink};letter-spacing:.04em">${name}</span>
				<span style="font-family:'SF Mono',Menlo,monospace;font-size:10px;font-weight:700;color:${t().red}">SEND &rsaquo;</span>
			</div>`).join("")}</div>
		</div>
		<div class="rcard-actions" style="color:${c.ink}">
			<span class="rcard-btn" style="color:${c.muted}" data-action="closeModal">CLOSE</span>
		</div>
	</div>`;
}
function renderModal() {
	const layer = document.getElementById("modalLayer");
	const sheet = document.getElementById("modalSheet");
	if (!modal) { layer.classList.remove("on"); sheet.innerHTML = ""; return; }
	layer.classList.add("on");
	if (modal.type === "resolver") sheet.innerHTML = resolverCard(modal.params);
	else if (modal.type === "seal") sheet.innerHTML = sealSheet(modal.params);
	else if (modal.type === "money") sheet.innerHTML = moneySheet(modal.params);
}

/* ============ EVENT DELEGATION ============ */
function handleClick(e) {
	const el = e.target.closest("[data-action]");
	if (!el) return;
	const d = el.dataset;
	switch (d.action) {
		case "go": go(d.screen, { ...d }); break;
		case "goTab": goTab(d.screen, { ...d }); break;
		case "back": back(); break;
		case "toggleTheme": toggleTheme(); break;
		case "restart": restart(); break;
		case "openModal": openModal(d.type, { ...d }); break;
		case "pickDispute": pickDispute(d.case, d.choice); break;
		case "fillField": fillField(d.field); break;
		case "addRule": addRule(); break;
		case "addComment": addComment((d.thread||"pizza") + "|" + (d.attemptidx||0)); break;
		case "addEntry": addEntry(d.case); break;
		case "voteProposal": voteProposal(d.case, d.pick); break;
		case "toggleBrehon": toggleBrehon(); break;
		case "copyCite": copyCite(d.case); break;
		case "toggleEdit": toggleEdit(); break;
		case "toggleSection": toggleSection(d.key, d.open === "1"); break;
		case "setCaseTab": setCaseTab(d.tab); break;
		case "setThreadFilter": setThreadFilter(d.filter); break;
		case "toggleFilterMenu": toggleFilterMenu(); break;
		case "postAttempt": postAttempt(d.thread); break;
		case "enterApp": enterApp(); break;
		case "finishOnboarding": finishOnboarding(); break;
		case "startChallenge": startChallenge(d.thread, +d.attemptidx); break;
		case "setChallengeRule": setChallengeRule(+d.rule); break;
		case "putUpSurety": putUpSurety(); break;
		case "startContest": startContest(d.case); break;
		case "postDefBond": postDefBond(); break;
		case "retainBacker": retainBacker(d.backer); break;
		case "setDefAdvocate": setDefAdvocate(d.advocate); break;
		case "finalizeContest": finalizeContest(d.case); break;
		case "lapseCase": lapseCase(d.case); break;
		case "acceptOffer": acceptOffer(d.case); break;
		case "declareDeadlock": declareDeadlock(d.case); break;
		case "abandonCase": abandonCase(d.case); break;
		case "pickAdj": pickAdj(d.adj); break;
		case "seatAdjudicator": seatAdjudicator(d.case); break;
		case "startAppeal": startAppeal(d.case); break;
		case "setAppealKind": setAppealKind(d.kind); break;
		case "postAppealBond": postAppealBond(); break;
		case "setAppealAdvocate": setAppealAdvocate(d.advocate); break;
		case "finalizeAppeal": finalizeAppeal(d.case); break;
		case "startRuleReview": startRuleReview(d.thread); break;
		case "setRVRule": setRVRule(+d.rule); break;
		case "setRVGround": setRVGround(d.ground); break;
		case "setRVAdvocate": setRVAdvocate(d.advocate); break;
		case "postRVBond": postRVBond(); break;
		case "finalizeRuleReview": finalizeRuleReview(d.thread); break;
		case "fundDoor": fundDoor(); break;
		case "withdrawAll": withdrawAll(); break;
		case "sendDemand": sendDemand(d.thread, +d.attemptidx); break;
		case "cureCase": cureCase(d.case); break;
		case "confirmCure": confirmCure(d.case); break;
		case "concedeCase": concedeCase(d.case); break;
		case "refuseCase": refuseCase(d.case, d.noreply === "1"); break;
		case "setChallengeBrehon": setChallengeBrehon(d.brehon); break;
		case "finalizeChallenge": finalizeChallenge(d.thread, +d.attemptidx); break;
		case "closeModal": closeModal(); break;
	}
}
document.body.addEventListener("click", handleClick);

/* snapwand: tap = bend, long-press = break, tap again = neutral */
let pressTimer = null, longFired = false;
document.body.addEventListener("pointerdown", e => {
	const el = e.target.closest("[data-votekey]");
	if (!el) return;
	longFired = false;
	pressTimer = setTimeout(() => {
		longFired = true;
		voteState[el.dataset.votekey] = "broken";
		renderAll();
	}, 550);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
	document.body.addEventListener(ev, () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }, true));
document.body.addEventListener("click", e => {
	const el = e.target.closest("[data-votekey]");
	if (!el) return;
	if (longFired) { longFired = false; return; }
	const k = el.dataset.votekey;
	voteState[k] = voteState[k] ? null : "bent";
	renderAll();
});

renderAll();

window.screens = screens; window.go = go; window.goTab = goTab; window.back = back;
</script>
</body></html>
