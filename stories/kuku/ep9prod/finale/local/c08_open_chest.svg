<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <rect width="720" height="720" fill="#00ff00"/>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd7840"/>
      <stop offset="0.48" stop-color="#754024"/>
      <stop offset="1" stop-color="#43231c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.48" stop-color="#d8a23f"/>
      <stop offset="1" stop-color="#8c5a20"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2e1717" flood-opacity="0.55"/>
    </filter>
  </defs>

  <ellipse cx="355" cy="640" rx="265" ry="38" fill="#5c3328" opacity="0.35"/>

  <g filter="url(#shadow)" stroke="#3b2019" stroke-linejoin="round">
    <!-- The lid is already open so the generated shot has only one acting task. -->
    <path d="M142 340 L172 112 Q184 72 228 62 H492 Q536 72 548 112 L578 340 Z"
          fill="url(#wood)" stroke-width="13"/>
    <path d="M174 313 L198 126 Q204 105 232 99 H488 Q516 105 522 126 L546 313 Z"
          fill="#2b1b27" stroke="#d7a348" stroke-width="12"/>
    <path d="M211 137 H509" fill="none" stroke="#b97738" stroke-width="12" opacity="0.82"/>

    <!-- Open box body and dark interior. -->
    <path d="M106 326 H614 L586 616 Q582 648 548 648 H172 Q138 648 134 616 Z"
          fill="url(#wood)" stroke-width="14"/>
    <path d="M120 330 Q360 278 600 330 L577 407 Q360 365 143 407 Z"
          fill="#1d1722" stroke="#d7a348" stroke-width="12"/>
    <path d="M144 446 H576 M151 583 H569" fill="none" stroke="#bc7838" stroke-width="13" opacity="0.76"/>

    <!-- One intact blank ring, still unsplit. -->
    <ellipse cx="360" cy="351" rx="112" ry="72" fill="none" stroke="url(#gold)" stroke-width="28"/>
    <path d="M293 318 Q360 280 427 318" fill="none" stroke="#ffe2a0" stroke-width="7" stroke-linecap="round"/>
    <rect x="341" y="399" width="38" height="27" rx="8" fill="#b67b30" stroke="#5f361e" stroke-width="7"/>
  </g>
</svg>
