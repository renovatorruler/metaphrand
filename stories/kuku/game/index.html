<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#bfe9f2">
    <link rel="icon" href="data:,">
    <title></title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans Devanagari", "Kohinoor Devanagari", Mangal, system-ui, sans-serif;
        background: #bfe9f2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #bfe9f2;
      }

      body {
        min-height: 100svh;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100svh;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" role="application" tabindex="0"></canvas>
    <script type="module" src="./assets/game.js"></script>
  </body>
</html>
