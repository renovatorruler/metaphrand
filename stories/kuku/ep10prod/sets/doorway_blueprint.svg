<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='290' viewBox='0 0 1240 290'><rect width='100%' height='100%' fill='#fbf8f1'/><text x='40' y='54' font-family='Helvetica' font-size='25' font-weight='bold' fill='#2c3e50'>EP10 SET BLUEPRINT — DOORWAY</text><text x='40' y='80' font-family='Helvetica' font-size='13.5' fill='#7f8c8d'>metres. LEFT: plan, looking straight down; the lane runs down the page away from the courtyard.</text><text x='204' y='116' font-family='Helvetica' font-size='12' font-weight='bold' fill='#8a7f68'>PLAN</text><circle cx='250' cy='132' r='6' fill='#2c3e50'/><line x1='260' y1='132' x2='462' y2='127' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='131' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>THE DOORWAY</text><text x='470' y='146' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>0 m along · 0 m up · the golden arch standing free between the worlds</text><circle cx='250' cy='200' r='6' fill='#2c3e50'/><line x1='260' y1='200' x2='462' y2='209' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='213' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>VILLAGE BEYOND</text><text x='470' y='228' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>4 m along · 0 m up · seen THROUGH the arch: दादी's village courtyard</text></svg>