<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='1202' viewBox='0 0 1240 1202'><rect width='100%' height='100%' fill='#fbf8f1'/><text x='40' y='54' font-family='Helvetica' font-size='25' font-weight='bold' fill='#2c3e50'>EP10 SET BLUEPRINT — COURTYARD</text><text x='40' y='80' font-family='Helvetica' font-size='13.5' fill='#7f8c8d'>metres. LEFT: plan, looking straight down; the lane runs down the page away from the courtyard.  RIGHT: elevation, looking from the side; the line is the ground falling 23 m.</text><text x='204' y='116' font-family='Helvetica' font-size='12' font-weight='bold' fill='#8a7f68'>PLAN</text><text x='880' y='116' font-family='Helvetica' font-size='12' font-weight='bold' fill='#8a7f68'>ELEVATION</text><line x1='900' y1='124' x2='900' y2='1132' stroke='#e0d8c6' stroke-width='1'/><rect x='206.44444444444446' y='458.6666666666667' width='87.11111111111111' height='653.3333333333334' fill='#e9e1d0' stroke='#8a7f68' stroke-width='2'/><line x1='250' y1='458.6666666666667' x2='250' y2='1112' stroke='#b9ad93' stroke-width='1' stroke-dasharray='7 7'/><rect x='200.44444444444446' y='1112' width='99.11111111111111' height='10' fill='#6d6151'/><polyline points='981,132 1107,175.55555555555554 981,262.6666666666667 1026,306.22222222222223 981,328 981,458.6666666666667' fill='none' stroke='#8a7f68' stroke-width='2.5'/><circle cx='250' cy='262.6666666666667' r='6' fill='#2c3e50'/><circle cx='981' cy='262.6666666666667' r='4' fill='#2c3e50'/><line x1='260' y1='262.6666666666667' x2='462' y2='257.6666666666667' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='261.6666666666667' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>FLIGHT RING</text><text x='470' y='276.6666666666667' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>-18 m along · 9 m up · the inverted stone ring of layered paper arcs, standing upright — FOURTEEN METRES across, wide enough for an enormous dragon to fly through with wings spread; never a human-sized hoop</text><circle cx='326.22222222222223' cy='306.22222222222223' r='6' fill='#2c3e50'/><circle cx='1026' cy='306.22222222222223' r='4' fill='#2c3e50'/><line x1='336.22222222222223' y1='306.22222222222223' x2='462' y2='315.22222222222223' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='319.22222222222223' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>BELL ARCH</text><text x='470' y='334.22222222222223' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>-14 m along · 14 m up · the stone arch carrying the bronze bell, RIGHT side and high — its span is ten metres so a flying dragon can pass beneath it; the bell hangs at its crown and must be visible</text><circle cx='250' cy='328' r='6' fill='#2c3e50'/><circle cx='981' cy='328' r='4' fill='#2c3e50'/><line x1='260' y1='328' x2='462' y2='323' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='327' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>MARKED FLAGSTONE</text><text x='470' y='342' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>-12 m along · 9 m up · the launch mark: a circle of ringed flagstones</text><circle cx='250' cy='132' r='6' fill='#2c3e50'/><circle cx='981' cy='132' r='4' fill='#2c3e50'/><line x1='260' y1='132' x2='462' y2='141' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='145' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>TEMPLE GATEWAY</text><text x='470' y='160' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>-30 m along · 9 m up · far behind the ring, the paper temple gateway</text><circle cx='424.22222222222223' cy='175.55555555555554' r='6' fill='#2c3e50'/><circle cx='1107' cy='175.55555555555554' r='4' fill='#2c3e50'/><line x1='434.22222222222223' y1='175.55555555555554' x2='462' y2='170.55555555555554' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='174.55555555555554' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>TOWER</text><text x='470' y='189.55555555555554' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>-26 m along · 23 m up · चील's closed stone tower, off to the RIGHT and high</text><circle cx='250' cy='458.6666666666667' r='6' fill='#2c3e50'/><circle cx='981' cy='458.6666666666667' r='4' fill='#2c3e50'/><line x1='260' y1='458.6666666666667' x2='462' y2='467.6666666666667' stroke='#cfc6b2' stroke-width='1'/><text x='470' y='471.6666666666667' font-family='Helvetica' font-size='15' font-weight='bold' fill='#2c3e50'>LANE HEAD</text><text x='470' y='486.6666666666667' font-family='Helvetica' font-size='11.5' fill='#7f8c8d'>0 m along · 9 m up · the courtyard's edge, where the lane begins</text></svg>