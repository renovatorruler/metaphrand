<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1500" height="860" fill="#f7f5f0"/>

  <text x="40" y="46" font-size="26" font-weight="bold" fill="#1a1a1a">SLEEPER COACH — ONE BAY, TOP-DOWN PLAN (v2: full occupancy)</text>
  <text x="40" y="72" font-size="15" fill="#555">Two long benches (3 seats each) + two short side benches (2 each), passageway between. EVERY SEAT TAKEN — crowded train, no empty spaces.</text>

  <line x1="1200" y1="58" x2="1420" y2="58" stroke="#888" stroke-width="2"/>
  <polygon points="1420,58 1408,52 1408,64" fill="#888"/>
  <text x="1200" y="46" font-size="13" fill="#888">direction of travel</text>

  <rect x="80" y="105" width="1340" height="640" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>

  <text x="88" y="98" font-size="13" fill="#666">OUTER WALL — WINDOWS (main bay side)</text>
  <g stroke="#2b6ca3" stroke-width="7">
    <line x1="150" y1="107" x2="330" y2="107"/><line x1="420" y1="107" x2="600" y2="107"/>
    <line x1="690" y1="107" x2="870" y2="107"/><line x1="960" y1="107" x2="1140" y2="107"/>
    <line x1="1230" y1="107" x2="1380" y2="107"/>
  </g>
  <g stroke="#2b6ca3" stroke-width="7">
    <line x1="150" y1="743" x2="330" y2="743"/><line x1="420" y1="743" x2="600" y2="743"/>
    <line x1="690" y1="743" x2="870" y2="743"/><line x1="960" y1="743" x2="1140" y2="743"/>
    <line x1="1230" y1="743" x2="1380" y2="743"/>
  </g>
  <text x="88" y="765" font-size="13" fill="#666">OUTER WALL — WINDOWS (side berth side)</text>

  <!-- passageway -->
  <rect x="82" y="462" width="1336" height="92" fill="#ece7dc"/>
  <line x1="82" y1="462" x2="1418" y2="462" stroke="#999" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="82" y1="554" x2="1418" y2="554" stroke="#999" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1130" y="514" font-size="20" fill="#8a7f6a" letter-spacing="3">P A S S A G E W A Y</text>
  <text x="96" y="514" font-size="14" fill="#8a7f6a">← next bay</text>
  <circle cx="640" cy="508" r="22" fill="#ded5c2" stroke="#8a7f6a" stroke-width="2"/>
  <text x="640" y="513" font-size="11" text-anchor="middle" fill="#6b6250">standee</text>
  <circle cx="960" cy="508" r="22" fill="#ded5c2" stroke="#8a7f6a" stroke-width="2"/>
  <text x="960" y="513" font-size="11" text-anchor="middle" fill="#6b6250">standee</text>

  <line x1="300" y1="107" x2="300" y2="462" stroke="#bbb" stroke-width="3"/>
  <line x1="880" y1="107" x2="880" y2="462" stroke="#bbb" stroke-width="3"/>

  <!-- LONG BENCH A -->
  <rect x="320" y="135" width="120" height="315" rx="8" fill="#cfd9e8" stroke="#1a1a1a" stroke-width="3"/>
  <text x="380" y="126" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">LONG BENCH A</text>
  <text x="290" y="180" font-size="12" text-anchor="end" fill="#999">window</text>
  <text x="290" y="295" font-size="12" text-anchor="end" fill="#999">middle</text>
  <text x="290" y="410" font-size="12" text-anchor="end" fill="#999">aisle</text>

