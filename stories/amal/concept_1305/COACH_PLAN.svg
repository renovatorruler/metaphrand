  <circle cx="800" cy="180" r="34" fill="#c9c2b4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="800" y="178" font-size="11" text-anchor="middle" fill="#222">passenger</text>
  <text x="800" y="192" font-size="11" text-anchor="middle" fill="#222">1</text>

  <circle cx="800" cy="295" r="36" fill="#c99a3c" stroke="#1a1a1a" stroke-width="3"/>
  <text x="800" y="301" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">RAJESH</text>

  <circle cx="800" cy="410" r="34" fill="#c9c2b4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="800" y="408" font-size="11" text-anchor="middle" fill="#222">passenger</text>
  <text x="800" y="422" font-size="11" text-anchor="middle" fill="#222">2</text>

  <line x1="455" y1="330" x2="725" y2="330" stroke="#bbb" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="590" y="322" font-size="13" text-anchor="middle" fill="#999">benches face each other</text>

  <!-- eyelines -->
  <path d="M 380 374 C 445 320 445 250 396 200" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 6"/>
  <polygon points="396,200 410,208 400,214" fill="#c0392b"/>
  <text x="470" y="270" font-size="14" font-weight="bold" fill="#c0392b">Suresh cranes past his wife</text>
  <text x="470" y="288" font-size="14" font-weight="bold" fill="#c0392b">→ the bundle</text>

  <line x1="380" y1="259" x2="380" y2="222" stroke="#8a5a52" stroke-width="2.5" stroke-dasharray="6 5"/>
