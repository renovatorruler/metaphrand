  <text x="435" y="578" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SHORT BENCH C</text>
  <circle cx="392" cy="646" r="32" fill="#c9c2b4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="392" y="644" font-size="11" text-anchor="middle" fill="#222">passenger</text>
  <text x="392" y="658" font-size="11" text-anchor="middle" fill="#222">3</text>
  <circle cx="480" cy="646" r="32" fill="#c9c2b4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="644" font-size="11" text-anchor="middle" fill="#222">passenger</text>
  <text x="480" y="658" font-size="11" text-anchor="middle" fill="#222">4</text>

  <rect x="630" y="586" width="230" height="120" rx="8" fill="#cfd9e8" stroke="#1a1a1a" stroke-width="3"/>
  <text x="745" y="578" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SHORT BENCH D</text>
  <circle cx="702" cy="646" r="32" fill="#c9c2b4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="702" y="644" font-size="11" text-anchor="middle" fill="#222">old man</text>
  <text x="702" y="658" font-size="10" text-anchor="middle" fill="#444">newspaper</text>
  <circle cx="790" cy="646" r="32" fill="#c9c2b4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="790" y="644" font-size="11" text-anchor="middle" fill="#222">passenger</text>
  <text x="790" y="658" font-size="11" text-anchor="middle" fill="#222">5</text>

  <!-- neighbouring bays -->
  <rect x="110" y="135" width="120" height="315" rx="8" fill="#eeeeee" stroke="#c4c4c4" stroke-width="2"/>
  <text x="170" y="298" font-size="12" text-anchor="middle" fill="#aaa">next bay</text>
  <rect x="950" y="135" width="120" height="315" rx="8" fill="#eeeeee" stroke="#c4c4c4" stroke-width="2"/>
  <rect x="1180" y="135" width="120" height="315" rx="8" fill="#eeeeee" stroke="#c4c4c4" stroke-width="2"/>
  <text x="1115" y="298" font-size="12" text-anchor="middle" fill="#aaa">next bay</text>
  <rect x="950" y="586" width="230" height="120" rx="8" fill="#eeeeee" stroke="#c4c4c4" stroke-width="2"/>
  <rect x="1230" y="586" width="180" height="120" rx="8" fill="#eeeeee" stroke="#c4c4c4" stroke-width="2"/>

  <text x="80" y="800" font-size="14" fill="#444"><tspan font-weight="bold">Her exit (scene 4):</tspan> she must ask Kamla and Suresh to let her out — squeezing past both of them, in full view, before she reaches the passageway.</text>
  <text x="80" y="824" font-size="13" fill="#666">Bench ≈ 0.45 m high · main berth ≈ 1.85 m × 0.72 m · passageway ≈ 0.55 m · upper berths omitted for clarity · 10 seated + 2 standing in this bay</text>

  <line x1="1200" y1="812" x2="1350" y2="812" stroke="#333" stroke-width="3"/>
